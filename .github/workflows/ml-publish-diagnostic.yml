name: Read ML feature publish failure
on:
  push:
    branches: [chatgpt/prop-ml-integration]
    paths: [.github/workflows/ml-publish-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  read-log:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capture final publish diagnostics only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh api /repos/CodingForTheFun/global-capital-/actions/jobs/103665123545/logs | tail -120 > evidence/publish-tail.txt
          cat evidence/publish-tail.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ml-publish-diagnostic
          path: evidence/
          retention-days: 2
