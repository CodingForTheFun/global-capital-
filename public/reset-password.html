<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#07111f" />
  <title>Reset password • Oblige Props</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#081321;color:#eaf2ff;font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:#102139;border:1px solid #29425f;border-radius:18px;padding:28px;box-shadow:0 24px 70px #0005}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.mark{width:34px;height:34px;border-radius:10px;background:#306fee;display:grid;place-items:center;font-weight:800}.brand b{font-size:18px}.brand small{display:block;color:#8fa5c1}h1{font-size:28px;line-height:1.15;margin:0 0 8px}.lead{color:#a5b7ce;margin:0 0 24px}label{display:block;color:#a5b7ce;font-size:13px;margin:0 0 7px}input{width:100%;height:48px;border:1px solid #304762;border-radius:10px;background:#0c1b2e;color:#fff;padding:0 12px;margin:0 0 16px;font:inherit}button{width:100%;height:48px;border:0;border-radius:10px;background:#306fee;color:#fff;font:700 15px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{margin-top:10px;background:transparent;border:1px solid #304762}.msg{min-height:22px;margin:14px 0 0;color:#b8c9df;font-size:13px}.msg.error{color:#ff9aa6}.hidden{display:none}.back{display:inline-block;margin-top:20px;color:#8fb9ff;text-decoration:none;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">O</span><span><b>Oblige Props</b><small>Password recovery</small></span></div>
    <section id="requestStep">
      <h1>Reset your password</h1>
      <p class="lead">Enter the email on your account. If it exists, we’ll email a six-digit reset code.</p>
      <form id="requestForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
        <button id="requestBtn" type="submit">Email reset code</button>
      </form>
      <p id="requestMsg" class="msg" role="status"></p>
    </section>

    <section id="resetStep" class="hidden">
      <h1>Enter your reset code</h1>
      <p class="lead">Use the code from your Oblige Props email and choose a new password.</p>
      <form id="resetForm">
        <label for="code">6-digit code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required />
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="10" required />
        <button id="resetBtn" type="submit">Set new password</button>
      </form>
      <button id="startOver" class="secondary" type="button">Use a different email</button>
      <p id="resetMsg" class="msg" role="status"></p>
    </section>

    <a class="back" href="/">← Back to sign in</a>
  </main>
<script>
(function(){
  var requestForm=document.getElementById('requestForm');
  var resetForm=document.getElementById('resetForm');
  var requestStep=document.getElementById('requestStep');
  var resetStep=document.getElementById('resetStep');
  var emailInput=document.getElementById('email');
  var requestMsg=document.getElementById('requestMsg');
  var resetMsg=document.getElementById('resetMsg');
  var requestBtn=document.getElementById('requestBtn');
  var resetBtn=document.getElementById('resetBtn');
  var activeEmail='';

  async function post(path, body){
    var response=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
    var data=await response.json().catch(function(){return{ok:false,message:'That request could not be completed.'};});
    return {response:response,data:data};
  }

  requestForm.onsubmit=async function(event){
    event.preventDefault();
    activeEmail=emailInput.value.trim();
    requestBtn.disabled=true;requestMsg.textContent='Sending…';requestMsg.classList.remove('error');
    try{
      var result=await post('/api/account/password/forgot',{email:activeEmail});
      requestMsg.textContent=result.data.message||'If that email has an account, a code is on its way.';
      if(result.response.ok){setTimeout(function(){requestStep.classList.add('hidden');resetStep.classList.remove('hidden');document.getElementById('code').focus();},450);}
      else requestMsg.classList.add('error');
    }catch(_){requestMsg.textContent='Could not reach the server. Try again.';requestMsg.classList.add('error');}
    finally{requestBtn.disabled=false;}
  };

  resetForm.onsubmit=async function(event){
    event.preventDefault();
    resetBtn.disabled=true;resetMsg.textContent='Updating password…';resetMsg.classList.remove('error');
    try{
      var result=await post('/api/account/password/reset',{email:activeEmail,code:document.getElementById('code').value.trim(),password:document.getElementById('password').value});
      resetMsg.textContent=result.data.message||'Password updated.';
      if(result.response.ok){resetForm.reset();setTimeout(function(){location.href='/';},1200);}else resetMsg.classList.add('error');
    }catch(_){resetMsg.textContent='Could not reach the server. Try again.';resetMsg.classList.add('error');}
    finally{resetBtn.disabled=false;}
  };

  document.getElementById('startOver').onclick=function(){activeEmail='';resetStep.classList.add('hidden');requestStep.classList.remove('hidden');requestMsg.textContent='';resetMsg.textContent='';requestForm.reset();resetForm.reset();emailInput.focus();};
})();
</script>
</body>
</html>
