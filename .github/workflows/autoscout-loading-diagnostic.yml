name: Auto Scout loading diagnostic
on:
  push:
    branches: [chatgpt/autoscout-loading-hotfix-20260913]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild exact production client bundle
        shell: bash
        run: |
          node scripts/prepare-edge-deploy.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { patchResearchUi } from './lib/autoscout/research-ui-runtime-patch.mjs';
          import { patchNavAndRingUi } from './lib/autoscout/nav-ring-runtime-patch.mjs';
          import { patchObligePropsVisualUi } from './lib/autoscout/oblige-props-visual-runtime-patch.mjs';
          const source = readFileSync('./apex-v2/scout-ui-v5.js','utf8');
          const runtime = patchObligePropsVisualUi(patchNavAndRingUi(patchResearchUi(source)));
          writeFileSync('/tmp/autoscout-client.js', runtime);
          console.log('runtime bytes', Buffer.byteLength(runtime));
          new Function(runtime);
          console.log('AUTO_SCOUT_CLIENT_PARSE_OK');
          NODE
      - name: Upload exact generated client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoscout-generated-client
          path: /tmp/autoscout-client.js
          retention-days: 1
