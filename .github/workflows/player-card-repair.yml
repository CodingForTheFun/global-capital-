name: Player card repair
on:
  push:
    branches: ['production-stable', 'chatgpt/player-card-dedupe-photos-20260919', 'claude/website-review-audit-t5ei2j']
    paths: ['apps/oblige-web/**', 'scripts/verify-restored-terminal.mjs', 'scripts/verify-player-cards-live.mjs', '.github/workflows/player-card-repair.yml']
  pull_request:
    branches: ['production-stable', 'claude/website-review-audit-t5ei2j']
    paths: ['apps/oblige-web/**', 'scripts/verify-restored-terminal.mjs', 'scripts/verify-player-cards-live.mjs', '.github/workflows/player-card-repair.yml']
permissions:
  contents: read
concurrency:
  group: player-card-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci
        working-directory: apps/oblige-web
      - name: Unit tests, TypeScript and production build
        working-directory: apps/oblige-web
        run: node --test tests/player-cards.test.mjs tests/player-headshots.test.mjs tests/workspace.test.mjs && npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Mobile and desktop regression tests
        run: |
          npm --prefix apps/oblige-web run start -- --port 3100 > /tmp/card-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/ >/dev/null
          node scripts/verify-restored-terminal.mjs
          node scripts/verify-canonical-workspace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-card-repair-proof
          path: |
            artifacts/restored-terminal
            artifacts/canonical-workspace
          retention-days: 7
  public-after-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/website-review-audit-t5ei2j'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real public photos, deployed card code and verified-account visual checks
        env:
          REFERENCE_VISUAL_EMAIL: ${{ secrets.REFERENCE_VISUAL_EMAIL }}
          REFERENCE_VISUAL_PASSWORD: ${{ secrets.REFERENCE_VISUAL_PASSWORD }}
        run: node scripts/verify-player-cards-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-card-live-proof
          path: artifacts/player-card-live
          retention-days: 7
