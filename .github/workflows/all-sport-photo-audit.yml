name: All-sport photo and research audit
on:
  push:
    branches: [chatgpt/all-sport-photos-research-429]
    paths: [.github/workflows/all-sport-photo-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public photo sources
        run: python scripts/photo-discovery-source-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: oblige-photo-source-contracts
          path: /tmp/oblige-audit/
          retention-days: 2
