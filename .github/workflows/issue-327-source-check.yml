name: Issue 327 source verification
on:
  push:
    branches: [chatgpt/issue-327-bounded-scheduler]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Archive dependencies for exact-version offline regression tests
        run: tar czf /tmp/issue-327-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: issue-327-deps
          path: /tmp/issue-327-deps.tar.gz
          retention-days: 1
