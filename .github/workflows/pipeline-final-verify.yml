name: Final multi-sport pipeline verification
on:
  push:
    branches: [chatgpt/multisport-log-pipeline-fix]
    paths: [.github/workflows/pipeline-final-verify.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'CodingForTheFun/global-capital-' && github.ref == 'refs/heads/chatgpt/multisport-log-pipeline-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksummed correctness follow-up
        id: apply
        run: |
          mkdir -p validation-output
          python3 <<'PY'
          import base64,hashlib,json,lzma,pathlib
          root=pathlib.Path.cwd()
          data=lzma.decompress(base64.b64decode(pathlib.Path('scripts/pipeline-season-fix.txt').read_text().strip(),validate=True))
          assert hashlib.sha256(data).hexdigest()=='f2d64a10b6f63c106f031c031f50ddd45cfe8fed9372ff84d7394e113fe619af'
          plan=json.loads(data)
          allowed={'lib/data-sources/espn/research.mjs','lib/data-sources/espn/stat-contract.mjs','tests/public-basketball-research.test.mjs','tests/multisport-pipeline-repair.test.mjs','scripts/qa-multisport-browser.mjs','tests/public-six-sport-research.test.mjs','tests/public-season-context.test.mjs','tests/fixtures/espn-epl-current.json'}
          assert {e['path'] for e in plan}==allowed and len(plan)==len(allowed)
          output={}
          for e in plan:
              p=root/e['path'];assert p.resolve().is_relative_to(root) and not p.is_symlink()
              old=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(old).hexdigest()==e['old'],e['path']
              lines=old.decode().splitlines(keepends=True)
              for a,b,s in reversed(e['edits']):
                  assert 0<=a<=b<=len(lines)
                  lines[a:b]=s.splitlines(keepends=True)
              new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==e['new'],e['path']
              output[p]=new
          for p,v in output.items():
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(v)
          pathlib.Path('validation-output/expected.json').write_text(json.dumps({e['path']:e['new'] for e in plan},indent=2))
          PY
      - name: Locked dependencies and full regression tests
        id: regression
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm run check 2>&1 | tee validation-output/regression.txt
      - name: Desktop and mobile browser verification
        if: always() && steps.apply.outcome == 'success'
        id: browser
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          node scripts/qa-multisport-browser.mjs 2>&1 | tee validation-output/browser.txt
      - name: Public history integration verification
        if: always() && steps.apply.outcome == 'success'
        id: history
        run: |
          set -o pipefail
          node scripts/verify-public-pipeline.mjs 2>&1 | tee validation-output/public-history.txt
      - name: Publish validated follow-up to isolated feature branch only
        if: steps.regression.outcome == 'success' && steps.browser.outcome == 'success' && steps.history.outcome == 'success'
        run: |
          test "$(git branch --show-current)" = 'chatgpt/multisport-log-pipeline-fix'
          python3 <<'PY'
          import json,pathlib,hashlib,subprocess
          expected=json.loads(pathlib.Path('validation-output/expected.json').read_text())
          for name,sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,name
          subprocess.run(['git','add','--',*expected],check=True)
          PY
          git rm scripts/pipeline-season-fix.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use verified active league seasons, reject cross-competition backfills and enforce defensive stat semantics'
          git push origin HEAD:refs/heads/chatgpt/multisport-log-pipeline-fix
          git rev-parse HEAD > validation-output/application-head.txt
      - name: Preserve tested source
        if: always() && steps.apply.outcome == 'success'
        run: |
          python3 <<'PY'
          import pathlib,subprocess,tarfile,json
          root=pathlib.Path.cwd()
          names=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          names.update(json.loads(pathlib.Path('validation-output/expected.json').read_text()))
          with tarfile.open('validation-output/tested-source.tar.gz','w:gz') as tar:
              for name in sorted(names):
                  if name and (root/name).is_file() and name!='scripts/pipeline-season-fix.txt':tar.add(root/name,arcname=name,recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-multisport-validation
          path: validation-output/
          retention-days: 5
