name: Issue 327 source verification
on:
  push:
    branches: [chatgpt/issue-327-bounded-scheduler]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for exact-revision offline regression tests
        run: git archive --format=tar HEAD | gzip > /tmp/issue-327-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: issue-327-source
          path: /tmp/issue-327-source.tar.gz
          retention-days: 1
