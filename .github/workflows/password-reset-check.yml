name: Password recovery verification

on:
  pull_request:
    branches: [production-stable, claude/website-review-audit-t5ei2j]
    paths:
      - 'apps/oblige-web/**'
      - 'lib/auth/**'
      - 'tests/password-reset-client.test.mjs'
      - 'scripts/verify-password-reset-ui.mjs'
      - '.github/workflows/password-reset-check.yml'
  push:
    branches: [claude/website-review-audit-t5ei2j]
    paths:
      - 'apps/oblige-web/**'
      - 'scripts/verify-password-reset-ui.mjs'
      - '.github/workflows/password-reset-check.yml'
  workflow_dispatch:
    inputs:
      public_readonly:
        description: 'Inspect deployed www UI with intercepted API fixtures and read-only backend preflight'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
      - name: Password recovery unit regressions
        run: node --test tests/password-reset-client.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install frontend dependencies
        if: ${{ !inputs.public_readonly }}
        working-directory: apps/oblige-web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build real frontend
        if: ${{ !inputs.public_readonly }}
        working-directory: apps/oblige-web
        env:
          OBLIGE_BACKEND_ORIGIN: http://127.0.0.1:9
        run: npm run typecheck && npm run build
      - name: Local mobile and desktop recovery flow
        if: ${{ !inputs.public_readonly }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/password-reset
          npm --prefix apps/oblige-web run start -- --hostname 127.0.0.1 --port 3000 > artifacts/password-reset/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/account > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat artifacts/password-reset/server.log; exit 1; fi
            sleep 1
          done
          test "$ready" = true
          node scripts/verify-password-reset-ui.mjs
      - name: Public read-only backend preflight
        if: ${{ inputs.public_readonly || github.event_name == 'push' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'https://www.obligeprops.com';
          const me = await fetch(origin + '/api/account/me', { signal: AbortSignal.timeout(20000) });
          assert.equal(me.status, 200);
          const account = await me.json();
          assert.equal(account.authenticated, false);
          assert.equal(account.user, null);
          assert.equal(account.mailConfigured, true, 'Reset email provider must be configured');
          const board = await fetch(origin + '/api/oblige-workspace?sport=NBA', { signal: AbortSignal.timeout(20000) });
          assert.ok([401, 403].includes(board.status), 'Protected research must stay closed when signed out');
          console.log(JSON.stringify({ origin, accountStatus: me.status, authenticated: false, mailConfigured: true, protectedApiStatus: board.status, realEmailDelivery: 'NOT_TESTED', realPasswordMutation: 'NOT_PERFORMED' }));
          NODE
      - name: Inspect deployed UI without sending emails or changing passwords
        if: ${{ inputs.public_readonly || github.event_name == 'push' }}
        env:
          RESET_UI_BASE_URL: https://www.obligeprops.com
        run: node scripts/verify-password-reset-ui.mjs
      - name: Preserve verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-recovery-verification-${{ github.run_id }}
          path: artifacts/password-reset/
          if-no-files-found: ignore
          retention-days: 7
