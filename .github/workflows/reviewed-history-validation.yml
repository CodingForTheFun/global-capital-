name: Reviewed history validation
on:
  push:
    branches: [chatgpt/obligepay-reviewed-history-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify public roster schema without paid requests
        run: |
          mkdir -p /tmp/history-review
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          const base = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
          for (const [name,path] of [['teams','/teams?limit=1000'],['buf','/teams/2/roster'],['mia','/teams/15/roster']]) {
            try {
              const r = await fetch(base+path,{signal:AbortSignal.timeout(12000)});
              const text = await r.text();
              await writeFile(`/tmp/history-review/${name}.json`,text);
              console.log(name,r.status,text.length);
            } catch(e) { console.log(name,e.name); }
          }
          JS
      - name: Syntax and regression suite
        run: npm run check
      - name: Publish verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-history-evidence
          path: /tmp/history-review/
          retention-days: 3
