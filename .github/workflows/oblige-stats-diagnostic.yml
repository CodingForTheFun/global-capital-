name: Oblige targeted stats diagnostic
on:
  push:
    branches: [chatgpt/oblige-actual-prop-stats]
    paths: [.github/workflows/oblige-stats-diagnostic.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture source and public responses (no credentials)
        shell: bash
        run: |
          mkdir -p diagnostic
          git archive HEAD -o diagnostic/source.tar
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse
          out=pathlib.Path('diagnostic')
          def capture(name,url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ObligeStatsQA/1.0'}),timeout=35) as r:
                data=json.load(r)
              (out/(name+'.json')).write_text(json.dumps(data))
              print(name,'OK')
              return data
            except Exception as e:
              (out/(name+'.json')).write_text(json.dumps({'error':type(e).__name__,'message':str(e)}))
              print(name,type(e).__name__)
          for sport in ['NFL','MLB','WNBA']:
            capture('board-'+sport,'https://www.obligepay.com/api/apex/props?'+urllib.parse.urlencode({'sport':sport}))
          for name in ['Jordan Love','Aaron Rodgers','Puka Nacua']:
            slug=name.lower().replace(' ','-')
            data=capture('search-'+slug,'https://site.web.api.espn.com/apis/search/v2?'+urllib.parse.urlencode({'query':name,'sport':'football'}))
            for group in (data or {}).get('results',[]):
              for row in group.get('contents',[]):
                if row.get('displayName','').lower()==name.lower() and row.get('defaultLeagueSlug')=='nfl':
                  aid=row.get('uid','').split('~a:')[-1]
                  if aid.isdigit():
                    root='https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/'+aid+'/gamelog'
                    capture('log-'+slug,root)
                    capture('log-2025-'+slug,root+'?season=2025')
            capture('live-research-'+slug,'https://www.obligepay.com/api/apex/research?'+urllib.parse.urlencode({'sport':'NFL','playerName':name,'market':'Passing Yards','marketId':'player_pass_yds','line':200.5,'side':'OVER'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oblige-stats-diagnostic
          path: diagnostic/
          retention-days: 1
