name: Organized player board validation
on:
  push:
    branches: [chatgpt/organized-player-board]
    paths: [.github/workflows/organized-board-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'CodingForTheFun/global-capital-' && github.ref == 'refs/heads/chatgpt/organized-player-board'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply base-checked targeted changes
        id: apply
        run: |
          mkdir -p validation-output
          python3 scripts/apply-organized-board.py
          python3 scripts/finalize-organized-board.py
      - name: Locked dependencies and complete regression suite
        id: tests
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm run check 2>&1 | tee validation-output/tests.txt
      - name: Desktop and mobile category and player-card verification
        if: always() && steps.apply.outcome == 'success'
        id: browser
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          node scripts/qa-multisport-browser.mjs 2>&1 | tee validation-output/browser.txt
      - name: Verify current public photos and historical stat columns
        if: always() && steps.apply.outcome == 'success'
        id: sources
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile,mkdtemp} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import path from 'node:path';
          import {createVerifiedArtwork} from './lib/autoscout/providers/verified-artwork.mjs';
          import {researchPlayerProp} from './lib/autoscout/research-service-v2.mjs';
          const artwork=createVerifiedArtwork({dataDir:await mkdtemp(path.join(tmpdir(),'photo-check-'))});
          const report={scope:'Real public source checks, not current sportsbook quotes or a production browser session',photos:[],history:[]};
          for(const [sport,name] of [['NFL','Aaron Rodgers'],['NBA','Jayson Tatum'],['WNBA','Caitlin Clark'],['MLB','Shohei Ohtani'],['MLS','Lionel Messi']]){
            const r=await artwork(sport,name);report.photos.push({sport,name,verified:r.verified,id:r.providerPlayerId,bytes:r.body.length,type:r.contentType});
            if(r.verified)await writeFile('validation-output/photo-'+sport+'.png',r.body);
          }
          for(const [playerName,providerMarketKey] of [['Jordan Love','player_pass_longest_completion'],['Puka Nacua','player_reception_longest'],['Micah Parsons','player_defensive_interceptions']]){
            const r=await researchPlayerProp({sport:'NFL',playerName,market:providerMarketKey,providerMarketKey,line:0.5,side:'OVER',games:15});
            report.history.push({playerName,market:providerMarketKey,available:r.available,code:r.code,games:r.gameLog?.length,l5:r.windows?.l5,firstGames:r.gameLog?.slice(0,2)});
          }
          await writeFile('validation-output/public-sources.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          assert.ok(report.photos.every(r=>r.verified),'Every sampled athlete must have a verified photograph');
          assert.ok(report.history.every(r=>r.available&&r.games>0),'Every new sampled market must have real historical rows');
          JS
      - name: Preserve exact tested application snapshot
        if: always() && steps.apply.outcome == 'success'
        run: |
          python3 <<'PY'
          import pathlib,subprocess,tarfile
          with tarfile.open('validation-output/tested-source.tar.gz','w:gz') as tar:
              for name in sorted(set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))):
                  if name and pathlib.Path(name).is_file():tar.add(name,arcname=name,recursive=False)
          PY
          git diff --stat > validation-output/changes.txt
      - name: Publish only after all three gates succeed
        if: steps.tests.outcome == 'success' && steps.browser.outcome == 'success' && steps.sources.outcome == 'success'
        run: |
          test "$(git branch --show-current)" = 'chatgpt/organized-player-board'
          git add apex-v2/scout-ui-v5.js apex-v2/research-ui.css frontdoor-prod.mjs lib/data-sources/espn/stat-contract.mjs lib/data-sources/espn/research.mjs lib/autoscout/research-service-v2.mjs scripts/qa-multisport-browser.mjs
          git rm scripts/apply-organized-board.py scripts/finalize-organized-board.py scripts/organized-board-browser-tests.txt .github/workflows/organized-board-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix verified player photos, categorize props and render one player card with genuine history states'
          git push origin HEAD:refs/heads/chatgpt/organized-player-board
          git rev-parse HEAD > validation-output/application-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organized-board-validation
          path: validation-output/
          retention-days: 7
