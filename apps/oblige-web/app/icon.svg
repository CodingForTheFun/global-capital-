<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1428"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DE8A8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="accent" x1="8" y1="36" x2="40" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DE8A8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Base tile -->
  <rect width="48" height="48" rx="13" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Radar / grid hints -->
  <circle cx="24" cy="24" r="14" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  <circle cx="24" cy="24" r="7" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Stylized OP trend vector -->
  <path d="M12 32L21 21L27 27L36 14" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="36" cy="14" r="3.5" fill="#3DE8A8" filter="url(#glow)"/>
  <circle cx="36" cy="14" r="1.5" fill="#FFFFFF"/>
</svg>
