name: Inspect prop ML integration contract
on:
  push:
    branches: [chatgpt/prop-ml-integration]
    paths: [.github/workflows/prop-ml-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read source interfaces only; do not execute upstream code
        run: |
          mkdir -p evidence/upstream
          git archive HEAD -o evidence/current-source.tar.gz
          python3 <<'PY'
          import json,pathlib,urllib.request
          root=pathlib.Path('evidence/upstream')
          req=urllib.request.Request('https://api.github.com/repos/tjjerome/Sportstradamus/git/trees/main?recursive=1',headers={'User-Agent':'ObligePay-integration-review'})
          tree=json.load(urllib.request.urlopen(req,timeout=30));(root/'tree.json').write_text(json.dumps(tree));sha=tree['sha'];print('Upstream commit',sha)
          files=['LICENSE','src/sportstradamus/prediction/model_prob.py','src/sportstradamus/prediction/scoring.py','src/sportstradamus/prediction/persist.py','src/sportstradamus/helpers/io.py','src/sportstradamus/helpers/provenance.py','src/sportstradamus/data/config/stat_meta.json','src/sportstradamus/training/markets.py','src/sportstradamus/stats/__init__.py']
          for name in files:
              url='https://raw.githubusercontent.com/tjjerome/Sportstradamus/'+sha+'/'+name
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True)
              try:p.write_bytes(urllib.request.urlopen(url,timeout=20).read())
              except Exception as e:print(name,type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prop-ml-inspection
          path: evidence/
          retention-days: 3
