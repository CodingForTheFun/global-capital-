name: Verify multi-sport pipeline repair
on:
  push:
    branches: [chatgpt/multisport-log-pipeline-fix]
    paths: [.github/workflows/pipeline-repair-verify.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'CodingForTheFun/global-capital-' && github.ref == 'refs/heads/chatgpt/multisport-log-pipeline-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact checksummed edits on isolated feature branch
        id: apply
        run: |
          mkdir -p validation-output
          python3 <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd()
          allowed = set('''AUTOPROP_COORDINATION.md
          apex-v2/research-ui.css
          apex-v2/scout-ui-v5.js
          apex-v2/server-core.mjs
          frontdoor-prod.mjs
          lib/analytics/research.mjs
          lib/analytics/rolling.mjs
          lib/autoscout/models.mjs
          lib/autoscout/persistence-scheduler.mjs
          lib/autoscout/providers/the-odds-api.mjs
          lib/autoscout/research-service-v2.mjs
          lib/data-sources/contract.mjs
          lib/data-sources/espn/identity.mjs
          lib/data-sources/espn/research.mjs
          lib/data-sources/espn/stat-contract.mjs
          lib/data-sources/espn/team-research.mjs
          scripts/qa-multisport-browser.mjs
          scripts/verify-public-pipeline.mjs
          tests/fixtures/espn-pipeline-extras.json
          tests/multisport-pipeline-repair.test.mjs
          tests/public-basketball-research.test.mjs
          tests/research-integrity.test.mjs'''.splitlines())
          raw = ''.join((root / f'scripts/pipeline-repair-chunk-{i}.txt').read_text().strip() for i in range(1,5))
          plan_bytes = lzma.decompress(base64.b64decode(raw, validate=True))
          assert hashlib.sha256(plan_bytes).hexdigest() == 'eaf1ef3ec3bc8deac071cd4306f400a11a1a0396024cd517a790ab75d969c6e0', 'Transport checksum mismatch'
          plan = json.loads(plan_bytes)
          assert {v['path'] for v in plan} == allowed and len(plan) == len(allowed)
          output = {}
          for entry in plan:
              p = root / entry['path']
              assert p.resolve().is_relative_to(root) and not p.is_symlink()
              data = p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(data).hexdigest() == entry['old'], f"Base changed: {entry['path']}"
              lines = data.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == entry['new'], f"Result mismatch: {entry['path']}"
              output[p] = new
          for p, data in output.items():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          (root/'validation-output/proposed-sha256.json').write_text(json.dumps({e['path']: e['new'] for e in plan}, indent=2))
          (root/'validation-output/allowlist.txt').write_text('\n'.join(e['path'] for e in plan))
          print(f'Applied {len(output)} files with matching before/after SHA-256 checksums.')
          PY
      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Full syntax and regression gate
        id: regression
        timeout-minutes: 6
        run: |
          set -o pipefail
          npm run check 2>&1 | tee validation-output/regression.txt
      - name: Install browser
        if: always() && steps.install.outcome == 'success'
        id: browser_install
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser gate
        if: always() && steps.browser_install.outcome == 'success'
        id: browser
        timeout-minutes: 4
        run: |
          set -o pipefail
          node scripts/qa-multisport-browser.mjs 2>&1 | tee validation-output/browser.txt
      - name: Real public game-log integration gate
        if: always() && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        id: history
        timeout-minutes: 5
        run: |
          set -o pipefail
          node scripts/verify-public-pipeline.mjs 2>&1 | tee validation-output/public-history.txt
      - name: Preserve tested source and report
        if: always() && steps.apply.outcome == 'success'
        run: |
          python3 <<'PY'
          import pathlib, subprocess, tarfile
          root=pathlib.Path.cwd()
          files=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          files.update((root/'validation-output/allowlist.txt').read_text().splitlines())
          with tarfile.open(root/'validation-output/tested-source.tar.gz','w:gz') as tar:
              for name in sorted(files):
                  if name and (root/name).is_file() and not name.startswith('scripts/pipeline-repair-chunk-'):
                      tar.add(root/name,arcname=name,recursive=False)
          PY
          git diff --stat > validation-output/diff-stat.txt
          git rev-parse HEAD > validation-output/base-head.txt
      - name: Publish validated application to feature branch only
        if: steps.regression.outcome == 'success' && steps.browser.outcome == 'success' && steps.history.outcome == 'success'
        id: publish
        run: |
          test "$(git branch --show-current)" = 'chatgpt/multisport-log-pipeline-fix'
          python3 <<'PY'
          import json,hashlib,pathlib,subprocess
          expected=json.loads(pathlib.Path('validation-output/proposed-sha256.json').read_text())
          for name,sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha, name
          subprocess.run(['git','add','--',*expected],check=True)
          PY
          git rm scripts/pipeline-repair-chunk-{1,2,3,4}.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix multi-sport game logs, entity isolation, season splits and automatic card hydration'
          git push origin HEAD:refs/heads/chatgpt/multisport-log-pipeline-fix
          git rev-parse HEAD > validation-output/application-head.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisport-pipeline-validation
          path: validation-output/
          retention-days: 5
