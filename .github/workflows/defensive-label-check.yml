name: Verify defensive assists label fallback
on:
  push:
    branches: [chatgpt/prop-coverage-note]
    paths: [.github/workflows/defensive-label-check.yml]
permissions:
  contents: write
jobs:
  check:
    if: github.repository == 'CodingForTheFun/global-capital-' && github.ref == 'refs/heads/chatgpt/prop-coverage-note'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add league-scoped display-label fallback and preserve live market key in QA
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('lib/data-sources/espn/stat-contract.mjs');s=p.read_text()
          old="const footballLabels = {sacks:['Sacks']"
          new="const footballLabels = {assists:['AssistedTackles'],'assisted tackles':['AssistedTackles'],sacks:['Sacks']"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('scripts/public-production-smoke.mjs');s=p.read_text()
          old="  researchUrl.searchParams.set('market', sample.market);"
          new=old+"\n  researchUrl.searchParams.set('marketId', sample.marketId || sample.statId || '');"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('tests/football-assists-label.test.mjs');assert not p.exists()
          p.write_text("import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {marketContract,statValue} from '../lib/data-sources/espn/stat-contract.mjs';\ntest('football assists means assisted tackles while basketball assists remains separate',()=>{\n for(const sport of ['NFL','NCAAF']){\n  const byLabel=marketContract({sport,market:'Assists'});\n  const byKey=marketContract({sport,market:'Assists',providerMarketKey:'player_assists'});\n  assert.deepEqual(byLabel.fields,['AssistedTackles']);\n  assert.deepEqual(byLabel.fields,byKey.fields);\n  assert.equal(statValue({totalTackles:'7',soloTackles:'4',assistTackles:'3'},byLabel),3);\n  assert.equal(statValue({assists:'8'},byLabel),null);\n }\n assert.deepEqual(marketContract({sport:'NBA',market:'Assists'}).fields,['Assists']);\n});\n")
          PY
      - name: Full regression gate
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Verify real defensive history for the live smoke sample
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {researchPlayerProp} from './lib/autoscout/research-service-v2.mjs';
          const r=await researchPlayerProp({sport:'NFL',playerName:'Jessie Bates III',market:'Assists',line:2.5,side:'OVER',games:20});
          console.log(JSON.stringify({scope:'real public defensive history with a test threshold, not a betting recommendation',available:r.available,code:r.code,games:r.gameLog?.length,windows:r.windows}));
          assert.equal(r.available,true);assert.ok(r.gameLog.length>0);assert.ok(Number.isFinite(r.windows.l5.hitRate));
          JS
      - name: Publish validated scoped correction to feature only
        run: |
          test "$(git branch --show-current)" = 'chatgpt/prop-coverage-note'
          git add lib/data-sources/espn/stat-contract.mjs scripts/public-production-smoke.mjs tests/football-assists-label.test.mjs
          git rm .github/workflows/defensive-label-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve football assists display labels to assisted tackles and verify real defensive history'
          git push origin HEAD:refs/heads/chatgpt/prop-coverage-note
