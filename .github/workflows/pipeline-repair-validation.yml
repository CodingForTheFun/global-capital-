name: Pipeline repair validation
on:
  push:
    branches: [chatgpt/multisport-log-pipeline-fix]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot tracked source for isolated local tests
        run: |
          mkdir -p /tmp/pipeline-evidence
          git archive --format=tar.gz HEAD > /tmp/pipeline-evidence/source.tar.gz
          git rev-parse HEAD > /tmp/pipeline-evidence/source-sha.txt
      - name: Capture public schema evidence without paid API requests
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          const base='https://site.web.api.espn.com/apis';
          async function get(name,url) {
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
              const text=await r.text();
              await writeFile(`/tmp/pipeline-evidence/${name}.json`,text);
              console.log(name,r.status,text.length);
              return JSON.parse(text);
            } catch(e) { console.log(name,'unavailable',e.name);return null; }
          }
          for(const [tag,name,sport,league,season] of [
            ['defense','Micah Parsons','football','nfl','2025'],
            ['kicking','Brandon McManus','football','nfl','2025'],
            ['pitching','Paul Skenes','baseball','mlb','2026'],
            ['goalie','Connor Hellebuyck','hockey','nhl','2026'],
            ['soccer','Erling Haaland','soccer','eng.1','2026'],
            ['mls','Lionel Messi','soccer','usa.1','2026'],
            ['college','Arch Manning','football','college-football','2026']
          ]) {
            const search=await get(`${tag}-search`,`${base}/search/v2?${new URLSearchParams({query:name,sport})}`);
            const candidates=(search?.results||[]).filter(g=>g.type==='player').flatMap(g=>g.contents||[]);
            const person=candidates.find(p=>p.displayName===name);
            const id=person?.uid?.match(/~a:(\d+)$/)?.[1];
            if(!id)continue;
            await get(`${tag}-log`,`${base}/common/v3/sports/${sport}/${league}/athletes/${id}/gamelog?season=${season}${tag==='pitching'?'&category=pitching':''}`);
            await get(`${tag}-profile`,`${base}/common/v3/sports/${sport}/${league}/athletes/${id}`);
            if(tag==='soccer')await get('ucl-log',`${base}/common/v3/sports/soccer/uefa.champions/athletes/${id}/gamelog?season=2026`);
          }
          await get('nfl-summary','https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401772968');
          await get('nfl-teams','https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams');
          const roster=await get('cbb-roster','https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/150/roster?season=2026');
          const first=roster?.athletes?.find(a=>a.id||a.items?.length);
          const player=first?.id?first:first?.items?.[0];
          if(player?.id)await get('cbb-log',`${base}/common/v3/sports/basketball/mens-college-basketball/athletes/${player.id}/gamelog?season=2026`);
          JS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-repair-evidence
          path: /tmp/pipeline-evidence/
          retention-days: 3
