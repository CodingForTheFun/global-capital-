name: Oblige Props production smoke

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    # Pull requests use the hermetic release checks. Push runs verify the
    # currently-live customer baseline before Railway is allowed to replace it.
    # A manual dispatch on production-stable remains the exact-SHA post-deploy
    # acceptance proof after Railway reports SUCCESS.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify customer domain, account gate, and live pipeline
        env:
          # A push run is a pre-deploy health baseline, so it must not wait for
          # the incoming SHA to already be live. Manual dispatches are run after
          # Railway success and still verify the exact selected production SHA.
          AUTOSCOUT_EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          AUTOSCOUT_SMOKE_SPORTS: NFL,MLB
          AUTOSCOUT_PUBLIC_URL: https://www.obligeprops.com
        run: node scripts/public-production-smoke-driver.mjs
