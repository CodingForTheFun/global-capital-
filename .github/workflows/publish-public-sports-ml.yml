name: Publish validated public-sports ML
on:
  push:
    branches: [chatgpt/activate-ml-20260913]
    paths: [.github/workflows/publish-public-sports-ml.yml]
permissions:
  contents: write
concurrency:
  group: autoscout-public-sports-publisher
  cancel-in-progress: false
jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install bounded trainer dependencies
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scikit-learn==1.7.2'
      - name: Collect, train, and gate every remaining sport sequentially
        run: |
          set -euo pipefail
          mkdir -p .training-public data/ml/research docs/ml-training
          for sport in NBA WNBA MLB NHL NCAAF NCAAB MLS EPL UCL; do
            echo "=== $sport ==="
            node scripts/collect-public-model-history.mjs "$sport" ".training-public/$sport-history.json"
            python scripts/train-public-research-models.py --input ".training-public/$sport-history.json" --output ".training-public/$sport-ridge-v1.json"
          done
      - name: Publish only cells that passed unchanged chronological gates
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          src=pathlib.Path('.training-public');dest=pathlib.Path('data/ml/research');reports=pathlib.Path('docs/ml-training')
          published={};withheld={}
          for sport in ['NBA','WNBA','MLB','NHL','NCAAF','NCAAB','MLS','EPL','UCL']:
              p=src/f'{sport}-ridge-v1.json';r=src/f'{sport}-ridge-v1-report.json'
              data=json.loads(p.read_text());report=json.loads(r.read_text())
              assert data['version']==1 and data['engine']=='Auto Scout ML' and data['sport']==sport
              models=data.get('models') or []
              for m in models:
                  v=m['validation']
                  assert v['observations']>=180 and v['events']>=50
                  assert v['rmse']<v['baselineRmse'] and v['mseDelta95'][1]<0
              if models:
                  shutil.copyfile(p,dest/f'{sport.lower()}-ridge-v1.json')
                  published[sport]=[m['marketId'] for m in models]
              withheld[sport]=[x['marketId'] for x in report['evidence'] if x['status']!='PASSED']
              shutil.copyfile(r,reports/f'{sport.lower()}-training-report.json')
          (reports/'public-sports-summary.json').write_text(json.dumps({'published':published,'withheld':withheld},indent=2)+'\n')
          print(json.dumps({'published':published,'withheldCounts':{k:len(v) for k,v in withheld.items()}},indent=2))
          PY
      - name: Run complete application regression suite with model packs present
        run: |
          npm ci --no-audit --no-fund
          node --test tests/research-ml-activation.test.mjs
          npm run check
      - name: Commit validated packs and evidence to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/ml/research/*.json
          git add docs/ml-training/*.json
          git commit -m 'Publish chronologically validated multi-sport research models'
          git push origin HEAD:chatgpt/activate-ml-20260913
