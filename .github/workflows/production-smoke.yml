name: Auto Scout production smoke

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    # PRs use mocked regression/browser checks. Live verification runs once after deployment.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public production pipeline and rendered prop card
        env:
          AUTOSCOUT_EXPECTED_SHA: ${{ github.sha }}
          AUTOSCOUT_SMOKE_SPORTS: NFL,MLB
          AUTOSCOUT_PUBLIC_URL: https://autoprop-live-production.up.railway.app
        run: node scripts/public-production-smoke-v2.mjs
