name: Validate per-prop ML and Taco isolation
on:
  push:
    branches: [chatgpt/prop-ml-integration]
    paths: [.github/workflows/prop-ml-verify.yml]
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'CodingForTheFun/global-capital-' && github.ref == 'refs/heads/chatgpt/prop-ml-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksummed source candidate without touching production
        id: apply
        run: |
          mkdir -p validation-output
          python3 <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          allowed=set('''.gitignore
          AUTOPROP_COORDINATION.md
          apex-v2/scout-ui-v5.js
          apps/guest-dashboard/app/layout.tsx
          apps/guest-dashboard/components/MLPrediction.tsx
          apps/guest-dashboard/components/SportsWorkspace.tsx
          apps/guest-dashboard/components/TacoBadge.tsx
          apps/guest-dashboard/lib/sports-workspace.ts
          docs/prop-ml-integration.md
          frontdoor-prod.mjs
          lib/ml/contract.mjs
          lib/ml/evaluate.mjs
          lib/ml/routes.mjs
          lib/ml/snapshot-store.mjs
          lib/ml/sportstradamus.mjs
          lib/ui/ml-prediction.d.mts
          lib/ui/ml-prediction.mjs
          lib/ui/offer-promotion.d.mts
          lib/ui/offer-promotion.mjs
          public/prop-ml.css
          scripts/evaluate-prop-ml.mjs
          scripts/export-sportstradamus.mjs
          scripts/qa-prop-ml.mjs
          tests/prop-ml-integration.test.mjs
          tests/taco-offer-isolation.test.mjs'''.splitlines())
          batches=[(''.join(pathlib.Path(f'scripts/prop-ml-chunk-{i}.txt').read_text().strip() for i in [1,2]),'f5ef2ebb90319c9b720ba3e936c5228d89c1cf943d79e02d9794b329cd32431d'),(pathlib.Path('scripts/prop-taco-followup.txt').read_text().strip(),'ecf7fb20ab2db6ea1d01539337e76cd3857078d5bd254cfa2305776fe44defae')]
          output={};expected={}
          for raw,checksum in batches:
              data=lzma.decompress(base64.b64decode(raw,validate=True))
              assert hashlib.sha256(data).hexdigest()==checksum,'Transport mismatch'
              plan=json.loads(data)
              assert len({e['path'] for e in plan})==len(plan)
              for e in plan:
                  assert e['path'] in allowed,e['path']
                  p=root/e['path'];assert p.resolve().is_relative_to(root) and not p.is_symlink()
                  old=output.get(p,p.read_bytes() if p.exists() else b'')
                  assert hashlib.sha256(old).hexdigest()==e['old'],'Base changed: '+e['path']
                  lines=old.decode().splitlines(keepends=True)
                  for a,b,s in reversed(e['edits']):
                      assert 0<=a<=b<=len(lines)
                      lines[a:b]=s.splitlines(keepends=True)
                  new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==e['new'],e['path']
                  output[p]=new;expected[e['path']]=e['new']
          assert set(expected)==allowed
          for p,data in output.items():
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          pathlib.Path('validation-output/expected.json').write_text(json.dumps(expected,indent=2))
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print('Applied 25 hash-verified source files; no model data, production settings or credentials were modified.')
          PY
      - name: Install locked application dependencies
        id: dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/guest-dashboard install --include=dev --no-audit --no-fund
      - name: Full regression tests
        id: regression
        run: |
          set -o pipefail
          npm run check 2>&1 | tee validation-output/regression.txt
      - name: Install browser tools
        if: always() && steps.dependencies.outcome == 'success'
        id: browser_install
        run: |
          npx playwright install --with-deps chromium
          npm install -g agent-browser
      - name: Desktop/mobile ML and exact-offer Taco fixture checks
        if: always() && steps.browser_install.outcome == 'success'
        id: ml_browser
        run: |
          set -o pipefail
          node scripts/qa-prop-ml.mjs 2>&1 | tee validation-output/ml-browser.txt
      - name: Build preserved Sportsbooks and guest workspace
        if: always() && steps.dependencies.outcome == 'success'
        id: build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          node scripts/prepare-edge-deploy.mjs
          npm --prefix apps/guest-dashboard run build 2>&1 | tee validation-output/guest-build.txt
      - name: Existing account, routing and workspace regression checks
        if: always() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success'
        id: workspace
        run: |
          set -o pipefail
          node scripts/verify-edge-release.mjs 2>&1 | tee validation-output/edge.txt
          node scripts/verify-workspace.mjs 2>&1 | tee validation-output/workspace.txt
      - name: Restore source before runtime build transforms and preserve evidence
        if: always() && steps.apply.outcome == 'success'
        run: |
          git restore --worktree -- public/index.html public/checkout.html public/manifest.webmanifest payments/paypal.mjs apex-v2/scout-ui-v5.js
          python3 <<'PY'
          import pathlib,json,hashlib,subprocess,tarfile
          expected=json.loads(pathlib.Path('validation-output/expected.json').read_text())
          for name,sha in expected.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,name
          names=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          with tarfile.open('validation-output/tested-source.tar.gz','w:gz') as tar:
              for name in sorted(names):
                  if name and pathlib.Path(name).is_file() and not name.startswith('scripts/prop-ml-chunk-') and name!='scripts/prop-taco-followup.txt':tar.add(name,arcname=name,recursive=False)
          PY
          cp -R artifacts validation-output/workspace-artifacts 2>/dev/null || true
      - name: Publish validated feature only
        if: steps.regression.outcome == 'success' && steps.ml_browser.outcome == 'success' && steps.workspace.outcome == 'success'
        run: |
          test "$(git branch --show-current)" = 'chatgpt/prop-ml-integration'
          git rm scripts/prop-ml-chunk-{1,2}.txt scripts/prop-taco-followup.txt .github/workflows/prop-ml-inspect.yml .github/workflows/prop-ml-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add gated per-prop ML result bridge and exact-offer-only Taco badges; no fabricated forecasts'
          git push origin HEAD:refs/heads/chatgpt/prop-ml-integration
          git rev-parse HEAD > validation-output/application-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prop-ml-taco-validation
          path: validation-output/
          retention-days: 7
