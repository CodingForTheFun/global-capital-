name: Auto Scout release checks

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Snipes syntax
        run: node --check lib/markets/line-lag.mjs && node --check scripts/patch-real-snipe-table.mjs && node --check tests/automatic-snipes.test.mjs
      - name: Snipes targeted tests
        run: node --test tests/automatic-snipes.test.mjs
      - name: Diagnose legacy test files
        shell: bash
        run: |
          : > failed-tests.txt
          for f in tests/*.test.mjs; do
            if ! node --test "$f" > one-test.log 2>&1; then
              echo "===== $f =====" >> failed-tests.txt
              cat one-test.log >> failed-tests.txt
              echo >> failed-tests.txt
            fi
          done
          if [ -s failed-tests.txt ]; then
            cat failed-tests.txt
            exit 1
          fi
      - name: Upload failing test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-report
          path: failed-tests.txt
          if-no-files-found: warn
