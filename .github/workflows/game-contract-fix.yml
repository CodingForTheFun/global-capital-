name: Fix public game identifiers
on:
  push:
    branches: [chatgpt/sportsbook-home-projections-tacos]
    paths: [.github/workflows/game-contract-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sportsbook-home-projections-tacos
      - name: Apply targeted public identifier changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(file,old,new):
              p=Path(file);s=p.read_text();assert s.count(old)==1,(file,s.count(old));p.write_text(s.replace(old,new,1))
          provider='lib/autoscout/providers/game-markets.mjs'
          replace(provider,'      key: book.key, name: book.title,','      sportsbookKey: book.key, name: book.title,')
          replace(provider,'        key: market.key, updatedAt:','        marketKey: market.key, updatedAt:')
          ui='apps/guest-dashboard/components/GameBoard.tsx'
          replace(ui,'type Market = { key: string;','type Market = { marketKey: string;')
          replace(ui,'type Book = { key: string;','type Book = { sportsbookKey: string;')
          p=Path(ui);s=p.read_text()
          for old,new in [('b.key','b.sportsbookKey'),('m.key','m.marketKey'),('x.key','x.marketKey')]:
              assert old in s,old
              s=s.replace(old,new)
          p.write_text(s)
          test='tests/sportsbook-repair.test.mjs'
          p=Path(test);s=p.read_text();s="import {sanitizePublicPayload} from '../lib/public-sanitize.mjs';\n"+s
          s+='''\ntest('public sanitization retains game selection identifiers without admitting secret keys',()=>{
           const response=sanitizePublicPayload({ok:true,games:normalizeGameMarkets([event],'NFL'),key:'secret-key-must-disappear'});
           assert.equal(response.key,undefined);
           const book=response.games[0].books[0];assert.equal(book.sportsbookKey,'book');assert.equal(book.key,undefined);
           for(const id of ['h2h','spreads','totals']){const market=book.markets.find(row=>row.marketKey===id);assert.ok(market,id);assert.ok(market.outcomes.length);assert.equal(market.key,undefined)}
          });\n''';p.write_text(s)
          qa='scripts/verify-sportsbook.mjs'
          replace(qa,"import {chromium} from 'playwright';","import {chromium} from 'playwright';\nimport {sanitizePublicPayload} from '../lib/public-sanitize.mjs';")
          replace(qa,'books.map(name=>({key:name.toLowerCase(),name,markets:','books.map(name=>({sportsbookKey:name.toLowerCase(),name,markets:')
          for name in ['h2h','spreads','totals']:
              replace(qa,"{key:'"+name+"',","{marketKey:'"+name+"',")
          replace(qa,"json:{ok:true,available:true,games:[game],coverage:{note:'Test fixture only'}}","json:sanitizePublicPayload({ok:true,available:true,games:[game],coverage:{note:'Test fixture only'}})")
          PY
          node --check lib/autoscout/providers/game-markets.mjs
          node --check scripts/verify-sportsbook.mjs
          node --test tests/sportsbook-repair.test.mjs
      - name: Commit isolated source fix
        run: |
          git config user.name 'CodingForTheFun'
          git config user.email '24641357+CodingForTheFun@users.noreply.github.com'
          git add lib/autoscout/providers/game-markets.mjs apps/guest-dashboard/components/GameBoard.tsx tests/sportsbook-repair.test.mjs scripts/verify-sportsbook.mjs
          git diff --cached --check
          git commit -m 'Preserve sportsbook and market identity through public sanitization'
          git push origin HEAD:chatgpt/sportsbook-home-projections-tacos
