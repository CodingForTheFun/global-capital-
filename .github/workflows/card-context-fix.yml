name: Preserve active card direction
on:
  push:
    branches: [chatgpt/sportsbook-home-projections-tacos]
    paths: [.github/workflows/card-context-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sportsbook-home-projections-tacos
      - name: Apply bounded source edits
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(file,old,new):
              p=Path(file);s=p.read_text();assert s.count(old)==1,(file,s.count(old));p.write_text(s.replace(old,new,1))
          replace('lib/projections/ask.mjs','  const payload = buildModelPayload(prop);', '''  const chosenSide = String(prop.side || prop.pickDirection || '').toUpperCase();
            const payload = { ...buildModelPayload(prop), selectedSide: ['OVER', 'UNDER'].includes(chosenSide) ? chosenSide : null };
            // The rolling hit rates belong to this side; unknown is never assumed OVER.''')
          replace('apps/guest-dashboard/components/PropInsight.tsx','gameStartTime: quote.gameStartTime,','gameStartTime: quote.gameStartTime,\n      side,')
          replace('apex-v2/scout-ui-v5.js',"prop:{sport:g.sport,playerName:g.playerName,market:g.market,marketId:g.marketId||'',line:num(line),", "prop:{sport:g.sport,playerName:g.playerName,market:g.market,marketId:g.marketId||'',line:num(line),side:side,")
          replace('tests/ask-gemini.test.mjs',"market:'Points',line:25.5,gameLog:","market:'Points',line:25.5,side:'UNDER',gameLog:")
          replace('tests/ask-gemini.test.mjs','assert.ok(body.systemInstruction);',"assert.ok(body.systemInstruction);assert.equal(JSON.parse(body.contents[0].parts[0].text).card.selectedSide,'UNDER');")
          replace('scripts/verify-sportsbook.mjs','body.prop.line===55.5&&body.prop.gameLog.length===5',"body.prop.side==='OVER'&&body.prop.line===55.5&&body.prop.gameLog.length===5")
          PY
          node --check lib/projections/ask.mjs
          node --check apex-v2/scout-ui-v5.js
      - name: Commit source without modifying workflows
        run: |
          git config user.name 'CodingForTheFun'
          git config user.email '24641357+CodingForTheFun@users.noreply.github.com'
          git add lib/projections/ask.mjs apps/guest-dashboard/components/PropInsight.tsx apex-v2/scout-ui-v5.js tests/ask-gemini.test.mjs scripts/verify-sportsbook.mjs
          git diff --cached --check
          git commit -m 'Carry selected Over/Under side into grounded Ask on both research views'
          git push origin HEAD:chatgpt/sportsbook-home-projections-tacos
