name: Apply isolated photo repair
on:
  push:
    branches: [chatgpt/all-sport-photos-research-429]
    paths: [.github/workflows/one-shot-photos-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/all-sport-photos-research-429'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/all-sport-photos-research-429
      - name: Apply exact-source integration
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          expected={'frontdoor-prod.mjs':'95b3cb4a086c086b6145609fff7b72a05900bcac895fda10a4606bae5b3468f8','lib/autoscout/providers/verified-artwork.mjs':'499d52f5445427e7131c44aca955709dde6d3328f90ac703ac43ff7851ee05ad'}
          for f,h in expected.items(): assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h, 'Source advanced: '+f
          def edit(f,old,new):
            p=Path(f);s=p.read_text();assert old in s,(f,old[:90]);p.write_text(s.replace(old,new,1))
          a='lib/autoscout/providers/verified-artwork.mjs'
          edit(a,"import crypto from 'node:crypto';", "import crypto from 'node:crypto';\nimport {createPhotoDiscovery,photoSport,validPhotoSport} from './player-photo-discovery.mjs';")
          edit(a,"const save=()=>{const temp=indexPath+'.tmp';try{writeFileSync(temp,JSON.stringify(index));renameSync(temp,indexPath);}catch{}finally{safeUnlink(temp);}};", "const save=()=>{const temp=indexPath+'.tmp';try{writeFileSync(temp,JSON.stringify(index));renameSync(temp,indexPath);return true;}catch{return false;}finally{safeUnlink(temp);}};")
          edit(a," async function json(url,ttl=3600000)", " const sourceWindows=new Map(),sourceCooldowns=new Map();\n async function json(url,ttl=3600000)")
          edit(a,"  const task=(async()=>{const response=await fetchImpl(url,{signal:AbortSignal.timeout(6000),headers:{accept:'application/json'}});if(!response.ok)throw Error('Source unavailable');const data=await response.json();", """  const task=(async()=>{
           const host=new URL(url).hostname,stamp=now(),recent=(sourceWindows.get(host)||[]).filter(t=>stamp-t<60000);
           if((sourceCooldowns.get(host)||0)>stamp||recent.length>=60)throw Error('Photo source cooldown');
           recent.push(stamp);sourceWindows.set(host,recent);
           const response=await fetchImpl(url,{signal:AbortSignal.timeout(6000),redirect:'error',headers:{accept:'application/json','user-agent':'ObligePropsPhotos/1.0 (+https://www.obligeprops.com)'}});
           if(response.status===429){const raw=response.headers.get('retry-after'),seconds=Number(raw);const delay=raw&&Number.isFinite(seconds)?seconds*1000:Date.parse(raw||'')-stamp;sourceCooldowns.set(host,stamp+Math.max(60000,Number.isFinite(delay)?delay:60000));}
           if(!response.ok)throw Error('Source unavailable');
           if(Number(response.headers.get('content-length'))>2000000)throw Error('Oversize photo metadata');
           const chunks=[];let size=0;for await(const chunk of response.body){size+=chunk.length;if(size>2000000)throw Error('Oversize photo metadata');chunks.push(chunk);}
           const data=JSON.parse(Buffer.concat(chunks).toString('utf8'));""")
          edit(a,"return {body:bytes,contentType:type,source:'ESPN',playerName:athlete.playerName", "return {body:bytes,contentType:type,source:'ESPN',imageUrl:photo,sourceUrl:`https://www.espn.com/${family==='soccer'?'soccer':league}/player/_/id/${athlete.id}`,playerName:athlete.playerName")
          edit(a," async function get(sport,name,context={}){\n  sport=canonicalSport(sport);", " const discover=createPhotoDiscovery({json,imageBytes});\n async function get(sport,name,context={}){\n  sport=photoSport(sport);")
          edit(a,"  // A sport with no league slug has no team directory or athlete profile to\n // build a URL for, and ESPN publishes no soccer headshots through either, so\n // there is nothing here but the initials card.\n if(!PUBLIC_LEAGUES[sport]?.[1]||!name||context.entityType==='team')return fallback;", "  // Every valid sport can attempt photos independently of game-log support.\n  if(!validPhotoSport(sport)||!name||context.entityType==='team')return fallback;")
          edit(a,"return {...hit,status:200,body:readFileSync(file),cacheControl:'public, max-age=86400'};", "return {...hit,status:200,persisted:true,body:readFileSync(file),cacheControl:'public, max-age=86400'};")
          edit(a,"   let result=null,failed=false;try{result=await resolve(sport,name,context);}catch{failed=true;}", "   let result=null,failed=false;\n   if(PUBLIC_LEAGUES[sport]?.[1])try{result=await resolve(sport,name,context);}catch{failed=true;}\n   if(!result)try{result=await discover(sport,name,context);}catch{failed=true;}")
          edit(a,"    try{writeFileSync(path.join(directory,file),body);index[key]={...meta,file,bytes:body.length,expires:now()+7*DAY};retainedBytes+=body.length;}catch{}", "    let persisted=false;const temp=path.join(directory,file+'.tmp');\n    try{writeFileSync(temp,body);renameSync(temp,path.join(directory,file));index[key]={...meta,verifiedAt:new Date(now()).toISOString(),file,bytes:body.length,expires:now()+7*DAY};retainedBytes+=body.length;persisted=true;}catch{}finally{safeUnlink(temp);}")
          edit(a,"    save();return {...result,status:200,cacheControl:'public, max-age=86400'};}", "    persisted=save()&&persisted;return {...result,status:200,persisted,cacheControl:'public, max-age=86400'};}")
          f='frontdoor-prod.mjs'
          edit(f,"import { verifiedPlayerArtworkResponse as playerArtworkResponse }", "import { validPhotoSport, photoCreditPage } from './lib/autoscout/providers/player-photo-discovery.mjs';\nimport { verifiedPlayerArtworkResponse as playerArtworkResponse }")
          p=Path(f);s=p.read_text();start=s.index('async function maybeServeArtwork(');end=s.index('\n}',start)+2;block=s[start:end]
          assert '!RESEARCH_SPORTS.has(sport)' in block
          block=block.replace('!RESEARCH_SPORTS.has(sport)','!validPhotoSport(sport)')
          block=block.replace("    res.writeHead(image.status || 200, {", """    if (url.searchParams.get('format') === 'credits') {
                const body = photoCreditPage(image);
                res.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': image.verified ? 'public, max-age=86400' : 'no-store', 'x-content-type-options': 'nosniff' });
                res.end(body);
                return true;
              }
              if (!image.verified && url.searchParams.get('requirePhoto') === '1') {
                directJson(res, 404, { ok: false, code: 'PHOTO_UNAVAILABLE', message: 'No verified player photo is available yet.' }, { 'x-artwork-status': 'unavailable' });
                return true;
              }
              res.writeHead(image.status || 200, {""")
          block=block.replace("      'x-artwork-status': image.verified ? 'verified' : 'unavailable',", "      'x-artwork-status': image.verified ? 'verified' : 'unavailable',\n      'x-artwork-persisted': image.persisted ? 'true' : 'false',\n      'x-artwork-source': image.source || 'placeholder',")
          p.write_text(s[:start]+block+s[end:])
      - name: Verify and commit only the bounded source changes
        run: |
          node --check frontdoor-prod.mjs
          node --test tests/all-sport-photos.test.mjs tests/organized-player-board.test.mjs tests/storage-reclamation.test.mjs
          git diff --check
          git config user.name 'ObligeProps verified repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontdoor-prod.mjs lib/autoscout/providers/verified-artwork.mjs
          git commit -m 'Integrate all-sport saved photos without changing research or polling'
          git push origin HEAD:refs/heads/chatgpt/all-sport-photos-research-429
