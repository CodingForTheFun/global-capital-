name: Auto Scout release checks

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
  statuses: read

jobs:
  review-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reviewed merge from last deployed parent
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const branch = 'production-stable';
            const railwayContext = 'AutoProp Scout Pro - autoprop-live';
            const requiredParentWorkflows = [
              'Auto Scout release checks',
              'Oblige Props production smoke',
            ];
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const safeMarker = /\bSAFE\s+TO\s+MERGE\b/i;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: sha,
            });
            const parentSha = commit.parents?.[0]?.sha;
            if (!parentSha) {
              core.setFailed('Release gate could not identify the first parent commit.');
              return;
            }

            const { data: parentRunData } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch,
              event: 'push',
              head_sha: parentSha,
              per_page: 100,
            });
            const parentRuns = parentRunData.workflow_runs || [];
            const parentWorkflowRuns = new Map();
            for (const name of requiredParentWorkflows) {
              const run = parentRuns
                .filter((candidate) => candidate.name === name && candidate.head_sha === parentSha)
                .sort((a, b) => Date.parse(b.updated_at || b.created_at || '') - Date.parse(a.updated_at || a.created_at || ''))[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.setFailed(
                  `Release parent ${parentSha.slice(0, 12)} lacks a successful ${name} push run. Failed or skipped release parents cannot serialize production.`,
                );
                return;
              }
              parentWorkflowRuns.set(name, run);
            }

            const parentVerifiedAt = Math.max(
              ...requiredParentWorkflows.map((name) => {
                const run = parentWorkflowRuns.get(name);
                return Date.parse(run?.updated_at || run?.created_at || '') || 0;
              }),
            );

            const { data: parentStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: parentSha,
            });
            const parentDeploymentStatus = parentStatus.statuses
              .filter((status) =>
                status.context === railwayContext
                && status.state === 'success'
                && /\/service\/f6d34023-04e3-4799-a3c4-defab50a7a1e\?id=/.test(status.target_url || ''),
              )
              .sort((a, b) => Date.parse(b.created_at || '') - Date.parse(a.created_at || ''))
              .find((status) => (Date.parse(status.created_at || '') || 0) > parentVerifiedAt);
            if (!parentDeploymentStatus) {
              core.setFailed(
                `Release parent ${parentSha.slice(0, 12)} has no successful autoprop-live deployment status created after its required CI completed. Railway watch-path skips must not count as deployed parents.`,
              );
              return;
            }

            let pulls = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: sha,
                  per_page: 100,
                },
              );
              if (pulls.length) break;
              if (attempt < 6) await sleep(5000);
            }

            const pr = pulls.find(
              (item) => item.merged_at
                && item.base?.ref === branch
                && item.merge_commit_sha === sha,
            );
            if (!pr) {
              core.setFailed(
                'Production deployment requires a merged pull request into production-stable; direct pushes are not releasable.',
              );
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              const previous = latestByReviewer.get(login);
              const currentTime = Date.parse(review.submitted_at || '') || 0;
              const previousTime = Date.parse(previous?.submitted_at || '') || 0;
              if (!previous || currentTime >= previousTime) {
                latestByReviewer.set(login, review);
              }
            }

            const effectiveReviews = [...latestByReviewer.values()];
            const blockingReview = effectiveReviews.find(
              (review) => review.state === 'CHANGES_REQUESTED',
            );
            if (blockingReview) {
              core.setFailed(
                `PR #${pr.number} still has requested changes from ${blockingReview.user?.login || 'a reviewer'}.`,
              );
              return;
            }

            const approvedReview = effectiveReviews.find(
              (review) => review.state === 'APPROVED',
            );

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const mergedAt = Date.parse(pr.merged_at);
            const explicitSafeReview = comments.find((comment) => {
              if (!trustedAssociations.has(comment.author_association)) return false;
              if (!safeMarker.test(comment.body || '')) return false;
              return (Date.parse(comment.created_at || '') || 0) <= mergedAt;
            });

            if (!approvedReview && !explicitSafeReview) {
              core.setFailed(
                `PR #${pr.number} has no approving review and no pre-merge SAFE TO MERGE marker from a trusted repository member. Review must complete before customer-facing deployment can start.`,
              );
              return;
            }

            core.info(
              `Release gate passed for PR #${pr.number}; parent ${parentSha.slice(0, 12)} has successful post-CI deployment proof and review evidence is present.`,
            );

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and test suite
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee release-check.log
      - name: Upload failed release-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-log
          path: release-check.log
          if-no-files-found: error
          retention-days: 3
