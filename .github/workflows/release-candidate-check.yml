name: Auto Scout release checks

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Snipes syntax
        run: node --check lib/markets/line-lag.mjs && node --check scripts/patch-real-snipe-table.mjs && node --check tests/automatic-snipes.test.mjs
      - name: Snipes targeted tests
        run: node --test tests/automatic-snipes.test.mjs
      - name: Full test suite only
        run: npm test
      - name: Full syntax and test suite
        run: npm run check
