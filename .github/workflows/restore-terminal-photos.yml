name: Restore previous terminal and photos
on:
  push:
    branches: ['chatgpt/restore-previous-board-faces-20260918', 'claude/website-review-audit-t5ei2j']
    paths: ['apps/oblige-web/**', 'scripts/verify-restored-terminal.mjs', 'scripts/verify-canonical-workspace.mjs', 'scripts/verify-public-domain-routing.mjs', 'tests/public-domain-routing.test.mjs', '.github/workflows/restore-terminal-photos.yml']
  pull_request:
    branches: ['claude/website-review-audit-t5ei2j']
    paths: ['apps/oblige-web/**', 'scripts/verify-restored-terminal.mjs', 'scripts/verify-canonical-workspace.mjs', 'scripts/verify-public-domain-routing.mjs', 'tests/public-domain-routing.test.mjs', '.github/workflows/restore-terminal-photos.yml']
permissions:
  contents: read
concurrency:
  group: restored-terminal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/public-domain-routing.test.mjs
      - run: npm ci
      - run: npm ci
        working-directory: apps/oblige-web
      - name: Unit tests, TypeScript, production build
        working-directory: apps/oblige-web
        run: node --test tests/player-headshots.test.mjs tests/workspace.test.mjs && npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Previous mobile/desktop board and existing research interactions
        run: |
          npm --prefix apps/oblige-web run start -- --port 3100 > /tmp/restored-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/ > /dev/null
          node scripts/verify-restored-terminal.mjs
          node scripts/verify-canonical-workspace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-terminal-proof
          path: |
            artifacts/restored-terminal
            artifacts/canonical-workspace
          retention-days: 14
  public-after-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/website-review-audit-t5ei2j'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only public board and real photo delivery proof
        env:
          DOMAIN_PROOF_BOARD_ATTEMPTS: '12'
        run: node scripts/verify-public-domain-routing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-restored-terminal-proof
          path: artifacts/public-restored-terminal
          retention-days: 14
