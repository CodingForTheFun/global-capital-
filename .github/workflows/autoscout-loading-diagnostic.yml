name: Auto Scout loading diagnostic
on:
  push:
    branches: [chatgpt/autoscout-loading-hotfix-20260913]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild exact production client bundle
        shell: bash
        run: |
          node scripts/prepare-edge-deploy.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { patchResearchUi } from './lib/autoscout/research-ui-runtime-patch.mjs';
          import { patchNavAndRingUi } from './lib/autoscout/nav-ring-runtime-patch.mjs';
          import { patchObligePropsVisualUi } from './lib/autoscout/oblige-props-visual-runtime-patch.mjs';
          const source = readFileSync('./apex-v2/scout-ui-v5.js','utf8');
          let runtime = patchObligePropsVisualUi(patchNavAndRingUi(patchResearchUi(source)));
          runtime = runtime.replace(/<style id="oblige-props-pixel-target">([\s\S]*?)<\/style>/,(_m,css)=>`\n;(function(){var s=document.getElementById('oblige-props-pixel-target');if(!s){s=document.createElement('style');s.id='oblige-props-pixel-target';s.textContent=${JSON.stringify(css)};(document.head||document.documentElement).appendChild(s);}})();\n`);
          runtime = runtime.replace(/<script id="oblige-props-pixel-target-runtime">([\s\S]*?)<\/script>/,(_m,js)=>`\n${js}\n`);
          writeFileSync('/tmp/autoscout-client.js', runtime);
          console.log('runtime bytes', Buffer.byteLength(runtime));
          new Function(runtime);
          if (/<(?:style|script)\b/i.test(runtime)) throw new Error('raw HTML tag remains in JavaScript bundle');
          console.log('AUTO_SCOUT_CLIENT_PARSE_OK');
          NODE
      - name: Upload exact generated client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoscout-generated-client
          path: /tmp/autoscout-client.js
          retention-days: 1
