name: Train pinned sports models
on:
  push:
    branches: [chatgpt/ml-training-20260913]
    paths: [.github/workflows/ml-training-bootstrap.yml]
permissions:
  contents: read
concurrency:
  group: autoscout-model-training-bootstrap
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact previously reviewed upstream
        run: |
          mkdir -p training-output upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/tjjerome/Sportstradamus.git
          git -C upstream fetch --depth=1 origin a7c401297266142563b75104f4ea00d480fde3fb
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = a7c401297266142563b75104f4ea00d480fde3fb
          printf '%s\n' 'Original upstream training; only empty cold-start state initialized. No credentials, paid odds/proxy collection, production writes, withholding bypass, deterministic training, or gate modifications.' > training-output/scope.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ml-upstream-cpu-${{ runner.os }}-${{ hashFiles('upstream/poetry.lock') }}
      - name: Install locked CPU training environment
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -m pip install 'poetry==2.2.1'
          cd upstream
          poetry install --no-interaction --no-ansi 2>&1 | tee ../training-output/install.log
      - name: Bootstrap original NFL models
        timeout-minutes: 12
        run: |
          set -o pipefail
          cd upstream
          set +e
          timeout --signal=TERM --kill-after=15s 650s poetry run python ../scripts/train-upstream-bootstrap.py 2>&1 | tee ../training-output/training.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../training-output/trainer-exit-code.txt
          exit "$code"
      - name: Record actual artifacts and release gate state
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,shutil,datetime
          root=pathlib.Path('upstream/src/sportstradamus/data')
          out=pathlib.Path('training-output');out.mkdir(exist_ok=True)
          files=[]
          for folder in ['models','training','test_sets']:
              for p in sorted((root/folder).rglob('*')):
                  if not p.is_file() or p.is_symlink(): continue
                  if p.suffix not in ['.pkl','.json','.csv','.parquet']: continue
                  if p.stat().st_size>100_000_000: continue
                  rel=p.relative_to(root);dest=out/'candidate-artifacts'/rel
                  dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
                  files.append({'path':str(rel),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          report={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceCommit':'a7c401297266142563b75104f4ea00d480fde3fb','artifacts':files,'trainedModelFiles':sum(x['path'].startswith('models/') and x['path'].endswith('.pkl') for x in files),'productionEnabled':False,'reason':'Only original artifacts are recorded. No publication without the unchanged held-out real-lines validation and exact-target export.'}
          (out/'training-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-original-model-training
          path: training-output/
          retention-days: 7
          if-no-files-found: error
