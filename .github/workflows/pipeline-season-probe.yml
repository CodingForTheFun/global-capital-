name: Pipeline season schema verification
on:
  push:
    branches: [chatgpt/multisport-log-pipeline-fix]
    paths: [.github/workflows/pipeline-season-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const base='https://site.web.api.espn.com/apis/common/v3/sports/soccer/eng.1/athletes/253989/gamelog';
          const urls={
            nfl_clock:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1',
            epl_clock:'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?limit=1',
            nba_clock:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?limit=1',
            epl_2026:base+'?league=eng.1&season=2026',
            epl_2025:base+'?league=eng.1&season=2025',
            epl_year2025:base+'?league=eng.1&year=2025',
            parsons_2026:'https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/4361423/gamelog?season=2026'
          };
          for(const [name,url] of Object.entries(urls)){
            try { const r=await fetch(url,{signal:AbortSignal.timeout(15000)});const text=await r.text();
              await writeFile('evidence/'+name+'.json',text);
              const p=JSON.parse(text); console.log(name,r.status,JSON.stringify({season:p.season,leagueSeasons:p.leagues?.map(l=>({id:l.id,season:l.season})),filters:p.filters,groups:p.seasonTypes?.map(g=>({displayName:g.displayName,seasonType:g.seasonType,events:g.categories?.map(c=>c.events?.length)}))}));
            }catch(e){console.log(name,e.name);}
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-season-evidence
          path: evidence/
          retention-days: 3
