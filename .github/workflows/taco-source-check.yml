name: Taco public source check
on:
  push:
    branches: [chatgpt/sportsbook-home-projections-tacos]
    paths: [.github/workflows/taco-source-check.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One public GET; stop on access restriction
        run: |
          mkdir evidence
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          let report;
          try {
            const r=await fetch('https://api.prizepicks.com/projections',{signal:AbortSignal.timeout(15000),headers:{accept:'application/json'}});
            report={status:r.status};
            if(r.ok){
              const b=await r.json();
              report.keys=Object.keys(b);report.meta=b.meta;report.links=b.links;
              report.sample=(b.data||[]).slice(0,2);
              report.promos=(b.data||[]).filter(x=>Object.entries(x.attributes||{}).some(([k,v])=>/taco|flash_sale|discount|promo/.test(k)&&v!=null&&v!==false)).slice(0,12);
              report.included=(b.included||[]).slice(0,3);
              report.count=b.data?.length;
            }
          }catch(e){report={error:e.name};}
          await writeFile('evidence/taco-source.json',JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: taco-public-source-evidence
          path: evidence/
          retention-days: 1
