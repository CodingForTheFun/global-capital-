name: Player card repair
on:
  push:
    branches: [chatgpt/player-card-dedupe-photos-20260919]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p artifacts/card-repair
          git archive --format=tar HEAD apps/oblige-web scripts lib/web lib/autoscout/providers lib/data-sources/espn lib/data-sources/contract.mjs lib/props package.json package-lock.json .github/workflows > artifacts/card-repair/source.tar
      - name: Read-only public photo diagnostic
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const roots=['https://www.obligeprops.com','https://autoprop-live-production.up.railway.app'];
          const paths=['/api/account/me','/api/apex/player-artwork?sport=NFL&name=Patrick+Mahomes','/api/apex/player-artwork?sport=MLB&name=Shohei+Ohtani','/_next/image?url=https%3A%2F%2Fa.espncdn.com%2Fi%2Fheadshots%2Fnfl%2Fplayers%2Ffull%2F3139477.png&w=128&q=75'];
          const report=[];
          for(const root of roots)for(const path of paths){try{const r=await fetch(root+path,{signal:AbortSignal.timeout(12000),redirect:'manual'});const b=Buffer.from(await r.arrayBuffer());report.push({root,path,status:r.status,type:r.headers.get('content-type'),artwork:r.headers.get('x-artwork-status'),location:r.headers.get('location'),bytes:b.length,body:r.headers.get('content-type')?.includes('json')?b.toString().slice(0,200):null});}catch(e){report.push({root,path,error:e.name});}}
          await writeFile('artifacts/card-repair/public-probes.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-card-source
          path: artifacts/card-repair
          retention-days: 2
