name: Verify deployed organized board
on:
  push:
    branches: [production-stable]
    paths: ['lib/ui/prop-board.mjs', 'lib/autoscout/providers/verified-artwork.mjs', 'scripts/verify-organized-production.mjs', '.github/workflows/organized-board-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify actual desktop and mobile production cards
        env:
          AUTOSCOUT_PUBLIC_URL: https://www.obligeprops.com
          AUTOSCOUT_EXPECTED_SHA: ${{ github.sha }}
          AUTOSCOUT_SMOKE_EMAIL: ${{ secrets.AUTOSCOUT_SMOKE_EMAIL }}
          AUTOSCOUT_SMOKE_PASSWORD: ${{ secrets.AUTOSCOUT_SMOKE_PASSWORD }}
        run: node scripts/verify-organized-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-organized-board
          path: artifacts/organized-board/
          retention-days: 7
