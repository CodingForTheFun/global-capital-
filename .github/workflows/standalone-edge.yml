name: Independent Edge build and browser verification
on:
  push:
    branches: [standalone/edge-sports-20260912]
    paths-ignore: ['.deployment/**', 'DEPLOYMENT.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Verify arithmetic and build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Install browser verification tools
        run: |
          cd frontend && npx playwright install --with-deps chromium
          npm install -g agent-browser
      - name: Verify desktop, mobile, research, history and isolation
        run: node scripts/verify-browser.mjs
      - name: Package independent source and compiled site
        if: always()
        run: |
          tar --exclude=node_modules --exclude=dist --exclude=.git --exclude=artifacts --exclude=.deployment --exclude=deploy-public -czf /tmp/edge-standalone-source.tar.gz .
          mkdir -p artifacts
          cp /tmp/edge-standalone-source.tar.gz artifacts/
          if [ -d frontend/dist ]; then cd frontend/dist && zip -qr ../../artifacts/edge-static-site.zip .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-standalone-verified
          path: |
            artifacts/
            frontend/package-lock.json
          retention-days: 14
      - name: Prepare one-time encrypted deployment recipient
        run: node scripts/deploy-recipient.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: edge-deploy-recipient
          path: deploy-public/recipient.json
          retention-days: 1
      - name: Deploy only to the independent Netlify site
        env:
          READ_TOKEN: ${{ github.token }}
        run: node scripts/deploy-netlify.mjs
      - name: Verify published standalone site in browser
        env:
          LIVE_URL: https://edge-standalone-ty.netlify.app
        run: node scripts/verify-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-standalone-deployment-result
          path: |
            artifacts/netlify-deployment.txt
            artifacts/live/
          retention-days: 14
