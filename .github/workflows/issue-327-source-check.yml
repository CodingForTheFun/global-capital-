name: Issue 327 isolated verification
on:
  push:
    branches: [chatgpt/issue-327-bounded-scheduler]
    paths: ['.github/issue-327.patch.*', '.github/workflows/issue-327-source-check.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/chatgpt/issue-327-bounded-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the exact locally tested patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path('.github/issue-327.patch.part'+str(i)).read_text().strip() for i in (1,2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '45c0f56eaf09579de12ff04151721aed84ac47fc71687f3bf5abb66d367dc549'
          pathlib.Path('/tmp/issue327.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/issue327.patch'], check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','/tmp/issue327.patch'], check=True)
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full release checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee release-check.log
      - name: Verify production build composition in a disposable copy
        shell: bash
        run: |
          mkdir /tmp/issue327-composition
          tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C /tmp/issue327-composition
          ln -s "$PWD/node_modules" /tmp/issue327-composition/node_modules
          cd /tmp/issue327-composition
          node scripts/prepare-edge-deploy.mjs
          node --check lib/autoscout/persistence-scheduler.mjs
          node --test tests/public-persistence-lease-retry.test.mjs tests/scheduler-operation-isolation.test.mjs
      - name: Commit verified source to this feature branch only
        run: |
          test "$GITHUB_REF" = refs/heads/chatgpt/issue-327-bounded-scheduler
          git rm .github/issue-327.patch.part1 .github/issue-327.patch.part2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ingestion): bound provider and sport work without widening polling (#327)'
          git push origin HEAD:refs/heads/chatgpt/issue-327-bounded-scheduler
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-327-verification
          path: release-check.log
          if-no-files-found: ignore
          retention-days: 3
