name: Auto Scout release checks

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
  statuses: read

jobs:
  review-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reviewed merge from verified deployed ancestor
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const branch = 'production-stable';
            const railwayContext = 'AutoProp Scout Pro - autoprop-live';
            const railwayServicePath = /\/service\/f6d34023-04e3-4799-a3c4-defab50a7a1e\?id=/;
            const requiredParentWorkflows = [
              'Auto Scout release checks',
              'Oblige Props production smoke',
            ];
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const safeMarker = /\bSAFE\s+TO\s+MERGE\b/i;
            const recoveryMarker = /\bRELEASE\s+RECOVERY\s+VERIFIED\b/i;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function getCommit(ref) {
              const { data } = await github.rest.repos.getCommit({ owner, repo, ref });
              return data;
            }

            async function latestPushRun(headSha, name) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                branch,
                event: 'push',
                head_sha: headSha,
                per_page: 100,
              });
              return (data.workflow_runs || [])
                .filter((candidate) => candidate.name === name && candidate.head_sha === headSha)
                .sort((a, b) =>
                  Date.parse(b.updated_at || b.created_at || '') -
                  Date.parse(a.updated_at || a.created_at || '')
                )[0] || null;
            }

            async function verifiedDeployment(ref) {
              const runs = new Map();
              for (const name of requiredParentWorkflows) {
                const run = await latestPushRun(ref, name);
                if (!run || run.status !== 'completed' || run.conclusion !== 'success') return null;
                runs.set(name, run);
              }
              const verifiedAt = Math.max(
                ...requiredParentWorkflows.map((name) => {
                  const run = runs.get(name);
                  return Date.parse(run?.updated_at || run?.created_at || '') || 0;
                }),
              );
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref,
              });
              const deployment = (status.statuses || [])
                .filter((row) =>
                  row.context === railwayContext
                  && row.state === 'success'
                  && railwayServicePath.test(row.target_url || '')
                  && (Date.parse(row.created_at || '') || 0) > verifiedAt
                )
                .sort((a, b) =>
                  Date.parse(b.created_at || '') - Date.parse(a.created_at || '')
                )[0] || null;
              return deployment ? { sha: ref, deployment, verifiedAt } : null;
            }

            async function findVerifiedDeployedAncestor(startSha, maxDepth = 30) {
              let cursor = startSha;
              for (let depth = 0; depth < maxDepth && cursor; depth += 1) {
                const proof = await verifiedDeployment(cursor);
                if (proof) return { ...proof, depth };
                const commit = await getCommit(cursor);
                cursor = commit.parents?.[0]?.sha || null;
              }
              return null;
            }

            let pulls = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: sha,
                  per_page: 100,
                },
              );
              if (pulls.length) break;
              if (attempt < 6) await sleep(5000);
            }

            const pr = pulls.find(
              (item) => item.merged_at
                && item.base?.ref === branch
                && item.merge_commit_sha === sha,
            );
            if (!pr) {
              core.setFailed(
                'Production deployment requires a merged pull request into production-stable; direct pushes are not releasable.',
              );
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              const previous = latestByReviewer.get(login);
              const currentTime = Date.parse(review.submitted_at || '') || 0;
              const previousTime = Date.parse(previous?.submitted_at || '') || 0;
              if (!previous || currentTime >= previousTime) latestByReviewer.set(login, review);
            }

            const effectiveReviews = [...latestByReviewer.values()];
            const blockingReview = effectiveReviews.find(
              (review) => review.state === 'CHANGES_REQUESTED',
            );
            if (blockingReview) {
              core.setFailed(
                `PR #${pr.number} still has requested changes from ${blockingReview.user?.login || 'a reviewer'}.`,
              );
              return;
            }

            const approvedReview = effectiveReviews.find(
              (review) => review.state === 'APPROVED',
            );
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const mergedAt = Date.parse(pr.merged_at);
            const trustedPreMergeComments = comments.filter((comment) =>
              trustedAssociations.has(comment.author_association)
              && (Date.parse(comment.created_at || '') || 0) <= mergedAt
            );
            const explicitSafeReview = trustedPreMergeComments.find((comment) =>
              safeMarker.test(comment.body || '')
            );
            if (!approvedReview && !explicitSafeReview) {
              core.setFailed(
                `PR #${pr.number} has no approving review and no pre-merge SAFE TO MERGE marker from a trusted repository member. Review must complete before customer-facing deployment can start.`,
              );
              return;
            }

            const commit = await getCommit(sha);
            const parentSha = commit.parents?.[0]?.sha;
            if (!parentSha) {
              core.setFailed('Release gate could not identify the first parent commit.');
              return;
            }

            const immediateProof = await verifiedDeployment(parentSha);
            if (immediateProof) {
              core.info(
                `Release gate passed for PR #${pr.number}; immediate parent ${parentSha.slice(0, 12)} has successful post-CI deployment proof and review evidence is present.`,
              );
              return;
            }

            // Recovery path: never treat a Railway watch-path skip as deployed.
            // Walk the first-parent production history to the nearest commit that
            // actually completed both required CI workflows and then received a
            // successful autoprop-live deployment status. A trusted pre-merge
            // recovery marker must explicitly name that anchor.
            const anchor = await findVerifiedDeployedAncestor(parentSha);
            if (!anchor) {
              core.setFailed(
                'Release recovery could not find a verified deployed ancestor within 30 first-parent commits.',
              );
              return;
            }

            const anchorShort = anchor.sha.slice(0, 12);
            const recoveryReview = trustedPreMergeComments.find((comment) => {
              const body = comment.body || '';
              return safeMarker.test(body)
                && recoveryMarker.test(body)
                && body.toLowerCase().includes(anchorShort.toLowerCase());
            });
            if (!recoveryReview) {
              core.setFailed(
                `Release parent ${parentSha.slice(0, 12)} is not a verified deployment. Recovery requires a trusted pre-merge comment containing SAFE TO MERGE, RELEASE RECOVERY VERIFIED, and deployed anchor ${anchorShort}.`,
              );
              return;
            }

            const { data: compare } = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: anchor.sha,
              head: sha,
            });
            const aheadBy = Number(compare.ahead_by || 0);
            if (!Number.isFinite(aheadBy) || aheadBy < 1 || aheadBy > 50) {
              core.setFailed(
                `Release recovery span from ${anchorShort} is outside the bounded 1-50 commit window (ahead_by=${aheadBy}).`,
              );
              return;
            }

            core.info(
              `Release recovery gate passed for PR #${pr.number}; verified deployed anchor ${anchorShort} is ${anchor.depth} first-parent step(s) behind the immediate parent, the recovery review names that anchor, and this workflow's test job plus production smoke must still pass before Railway can deploy.`,
            );

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and test suite
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee release-check.log
      - name: Upload failed release-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-log
          path: release-check.log
          if-no-files-found: error
          retention-days: 3
