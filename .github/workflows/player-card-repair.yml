name: Player card repair
on:
  push:
    branches: [chatgpt/player-card-dedupe-photos-20260919]
permissions:
  contents: write
concurrency:
  group: player-card-preparation
  cancel-in-progress: true
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/player-card-dedupe-photos-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source-checked component repair
        run: python3 scripts/prepare-card-repair.py
      - run: npm ci
      - run: npm ci
        working-directory: apps/oblige-web
      - name: Unit tests, TypeScript and production build
        working-directory: apps/oblige-web
        run: node --test tests/player-cards.test.mjs tests/player-headshots.test.mjs tests/workspace.test.mjs && npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          npm --prefix apps/oblige-web run start -- --port 3100 > /tmp/card-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/ >/dev/null
          node scripts/verify-restored-terminal.mjs
          node scripts/verify-canonical-workspace.mjs
      - name: Commit verified component changes only to isolated branch
        run: |
          test "$(git branch --show-current)" = chatgpt/player-card-dedupe-photos-20260919
          git diff --exit-code -- apps/oblige-web/components/terminal-board.module.css
          git add apps/oblige-web/components/terminal-board.tsx apps/oblige-web/components/player-view.tsx apps/oblige-web/components/face-card.tsx apps/oblige-web/components/prop-workspace.tsx
          git -c user.name='ObligeProps verified repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix duplicate player cards and keep all stat and book choices inside research'
          git push origin HEAD:refs/heads/chatgpt/player-card-dedupe-photos-20260919
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-card-repair-proof
          path: |
            artifacts/restored-terminal
            artifacts/canonical-workspace
          retention-days: 7
