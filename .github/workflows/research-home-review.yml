name: Auto Scout research home review
on:
  push:
    branches: [chatgpt/restore-obligepay-autoscout-20260913]
  pull_request:
    paths:
      - 'lib/edge/**'
      - 'public/edge-workspace-nav.*'
      - 'apps/guest-dashboard/app/**'
      - 'scripts/verify-research-home.mjs'
      - 'tests/research-home.test.mjs'
      - '.github/workflows/research-home-review.yml'
permissions:
  contents: read
concurrency:
  group: research-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git archive --format=zip --output=/tmp/research-home-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: research-home-source
          path: /tmp/research-home-source.zip
          retention-days: 1
      - name: Verify restored research home
        if: ${{ hashFiles('scripts/verify-research-home.mjs') != '' }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm ci --ignore-scripts --no-audit --no-fund --prefix apps/guest-dashboard
          node scripts/apply-edge-brand.mjs
          npm run build --prefix apps/guest-dashboard
          npx playwright install --with-deps chromium
          node scripts/verify-research-home.mjs
          node scripts/test-intelligence-browser.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('scripts/verify-research-home.mjs') != '' }}
        with:
          name: research-home-browser-evidence
          path: |
            artifacts/research-home/
            test-results/intelligence/
          retention-days: 3
