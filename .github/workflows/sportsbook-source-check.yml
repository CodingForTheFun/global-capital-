name: Sportsbook repair source checkpoint
on:
  push:
    branches: [chatgpt/sportsbook-home-projections-tacos]
    paths: [.github/workflows/sportsbook-source-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source and read-only public readiness
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/source.tar
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const origin='https://www.obligepay.com';
          const report={};
          for(const route of ['/api/guest-health','/api/apex/projection-health','/api/apex/research-health','/api/account/health','/api/apex/health']){
            try {const r=await fetch(origin+route,{signal:AbortSignal.timeout(10000)});report[route]={status:r.status,body:await r.json()};}
            catch(e){report[route]={error:e.name};}
          }
          await writeFile('evidence/public-readiness.json',JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sportsbook-source-checkpoint
          path: evidence/
          retention-days: 1
