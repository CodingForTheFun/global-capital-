name: Pipeline season schema verification
on:
  push:
    branches: [chatgpt/multisport-log-pipeline-fix]
    paths: [.github/workflows/pipeline-season-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const base='https://site.web.api.espn.com/apis/common/v3/sports/soccer/eng.1/athletes/253989/gamelog';
          const urls={
            ordered:base+'?season=2025&league=eng.1',
            all_competition:base.replace('/eng.1/','/all/')+'?season=2025&league=eng.1',
            regional:base+'?season=2025&league=eng.1&lang=en&region=us'
          };
          for(const [name,url] of Object.entries(urls)){
            try { const r=await fetch(url,{signal:AbortSignal.timeout(15000)});const text=await r.text();
              await writeFile('evidence/'+name+'.json',text);
              const p=JSON.parse(text); console.log(name,r.status,JSON.stringify({filters:p.filters,leagues:[...new Set(Object.values(p.events||{}).map(e=>e.leagueAbbreviation))],groups:p.seasonTypes?.map(g=>({displayName:g.displayName,events:g.categories?.map(c=>c.events?.length)}))}));
            }catch(e){console.log(name,e.name);}
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-season-evidence
          path: evidence/
          retention-days: 3
