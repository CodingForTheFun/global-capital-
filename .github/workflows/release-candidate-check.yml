name: Scout Pro release candidate checks

on:
  push:
    branches:
      - claude/pickfinder-auth-modal-fix-dle7hz
      - chatgpt/api-first-props-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and test suite
        run: npm run check
