name: Apply reviewed history once
on:
  push:
    branches: [chatgpt/obligepay-reviewed-history-repair]
    paths: [.github/workflows/apply-reviewed-history-once.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-history-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'CodingForTheFun/global-capital-' && github.ref == 'refs/heads/chatgpt/obligepay-reviewed-history-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and apply exact reviewed patch
        run: |
          mkdir -p /tmp/history-applied
          test "$(git rev-parse HEAD^)" = f5f9db4f8c823a586405eadb858b7db8bc97afe6
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          text = ''.join(pathlib.Path('reviewed-history-patch.part'+str(n)).read_text() for n in (1,2))
          patch = lzma.decompress(base64.b64decode(''.join(text.split()), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '15c465fdbb06d7b71d06afedbd9d914157f1eeeecf63d7c6e7e1fac77bf771e3', 'Patch integrity mismatch'
          path = '/tmp/history-applied/reviewed.patch'
          pathlib.Path(path).write_bytes(patch)
          subprocess.run(['git','apply','--check',path],check=True)
          subprocess.run(['git','apply',path],check=True)
          expected = {
            'apex-v2/scout-ui-v5.js':'2c661e4d22eab53fae24176853c8471ede8286ef',
            'docs/obligepay-history-repair-2026-09-12.md':'95ac64e03d6ebf8cb5b671c98f2dd092a1109316',
            'lib/data-sources/espn/research.mjs':'9a5fa499ff942446e82740aefd3c370d2a6bb160',
            'scripts/verify-history-ui.mjs':'15e99d2167fc73a3e356d6c84b6d2c329c8e0d44',
            'tests/fixtures/espn-history-repair.json':'f1fda7c60da0474237db52e48ed68e4f5f65d956',
            'tests/public-history-repair.test.mjs':'ab2819c2a302e9e3f1b64005243adb4361259632',
            'tests/research-hydration-repair.test.mjs':'11c6676bf68b66ae1a2d448293ecd67e0e876f71'
          }
          for file,sha in expected.items():
            actual = subprocess.check_output(['git','hash-object',file],text=True).strip()
            assert actual == sha, file+' source hash mismatch'
          subprocess.run(['git','add','--',*expected],check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths) == set(expected), 'Unexpected source changes'
          pathlib.Path('/tmp/history-applied/manifest.json').write_text(json.dumps(expected,indent=2))
          print('Verified all seven source hashes and exact patch scope')
          PY
      - run: npm ci
      - name: Run complete candidate regression checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/history-applied/check.log
      - name: Install isolated browser
        id: browser_install
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile using recorded responses
        id: browser
        if: steps.browser_install.outcome == 'success'
        continue-on-error: true
        env:
          QA_OUTPUT_DIR: /tmp/history-applied/browser
        run: |
          set -o pipefail
          node scripts/verify-history-ui.mjs 2>&1 | tee /tmp/history-applied/browser.log
      - name: Commit and push candidate only
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          test "$GITHUB_REF" = refs/heads/chatgpt/obligepay-reviewed-history-repair
          git rm -- reviewed-history-patch.part1 reviewed-history-patch.part2 .github/workflows/apply-reviewed-history-once.yml
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair public prop history identity, stat mapping and board hydration' -m "Hash-verified seven-file implementation; complete regression checks passed. Isolated browser result: ${BROWSER_RESULT}. Production is unchanged and this candidate is not approved for deployment."
          gh auth setup-git
          git push origin HEAD:refs/heads/chatgpt/obligepay-reviewed-history-repair
          git rev-parse HEAD | tee /tmp/history-applied/candidate-sha.txt
          printf '%s\n' "$BROWSER_RESULT" > /tmp/history-applied/browser-result.txt
          git archive --format=tar.gz HEAD > /tmp/history-applied/candidate-source.tar.gz
      - name: Preserve exact verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-history-verification
          path: /tmp/history-applied/
          retention-days: 3
