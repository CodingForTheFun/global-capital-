name: Auto Scout integrated release
on:
  pull_request:
    branches: [production-stable]
    paths: ['lib/edge/**', 'lib/ui/research-home.mjs', 'public/autoscout-home*', 'scripts/prepare-edge-deploy.mjs', 'scripts/verify-research-home.mjs', 'frontdoor-clearsports.mjs', 'Dockerfile', '.github/workflows/edge-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-and-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node scripts/prepare-edge-deploy.mjs
      - run: npx playwright install --with-deps chromium
      - name: Account, research, saved-prop and legacy-link regression
        run: node scripts/verify-research-home.mjs
      - name: Intelligence and ML/Taco regression
        run: |
          node scripts/test-intelligence-browser.mjs
          node scripts/qa-prop-ml.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoscout-integrated-verification
          path: |
            artifacts/
            test-results/intelligence/
          retention-days: 3
