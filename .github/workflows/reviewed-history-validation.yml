name: Reviewed history validation
on:
  push:
    branches: [chatgpt/obligepay-reviewed-history-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax and regression suite
        run: |
          mkdir -p /tmp/history-review
          git rev-parse HEAD > /tmp/history-review/candidate-sha.txt
          node --check scripts/verify-history-ui.mjs
          set -o pipefail
          npm run check 2>&1 | tee /tmp/history-review/check.log
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile replay (no live API calls)
        env:
          QA_OUTPUT_DIR: /tmp/history-review/browser
        run: |
          set -o pipefail
          node scripts/verify-history-ui.mjs 2>&1 | tee /tmp/history-review/browser.log
      - name: Capture candidate source
        if: always()
        run: git archive --format=tar.gz HEAD > /tmp/history-review/source.tar.gz
      - name: Publish verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-history-evidence
          path: /tmp/history-review/
          retention-days: 3
