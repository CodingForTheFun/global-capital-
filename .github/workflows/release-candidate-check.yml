name: Auto Scout release checks

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
  statuses: read

jobs:
  review-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require reviewed merge from verified deployed ancestry
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const branch = 'production-stable';
            const railwayContext = 'AutoProp Scout Pro - autoprop-live';
            const railwayServicePattern = /\/service\/f6d34023-04e3-4799-a3c4-defab50a7a1e\?id=/;
            const releaseWorkflow = 'Auto Scout release checks';
            const smokeWorkflow = 'Oblige Props production smoke';
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const safeMarker = /\bSAFE\s+TO\s+MERGE\b/i;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const maxDepth = 24;

            // These two immutable commits predate the enforced review marker but
            // both have successful test jobs and production-smoke runs. They are
            // the only one-time bootstrap exceptions between the last verified
            // deployed snapshot and the current serialized-release policy.
            const bootstrapUnreviewed = new Set([
              '1715e2032060fa20d5861dd6c10d242f18dbc0d9',
              '7dff776790b920fba8a9c34a0d1b47812b8d2a21',
            ]);

            const latestRun = (runs, name) => runs
              .filter((candidate) => candidate.name === name)
              .sort((a, b) => Date.parse(b.updated_at || b.created_at || '') - Date.parse(a.updated_at || a.created_at || ''))[0];

            const pushRuns = async (commitSha) => {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                branch,
                event: 'push',
                head_sha: commitSha,
                per_page: 100,
              });
              return (data.workflow_runs || []).filter((run) => run.head_sha === commitSha);
            };

            const firstParent = async (commitSha) => {
              const { data } = await github.rest.repos.getCommit({ owner, repo, ref: commitSha });
              return data.parents?.[0]?.sha || null;
            };

            const reviewedMerge = async (commitSha, { allowBootstrap = false, retry = false } = {}) => {
              let pulls = [];
              const attempts = retry ? 6 : 1;
              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                pulls = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: commitSha, per_page: 100 },
                );
                if (pulls.length) break;
                if (attempt < attempts) await sleep(5000);
              }
              const pr = pulls.find(
                (item) => item.merged_at
                  && item.base?.ref === branch
                  && item.merge_commit_sha === commitSha,
              );
              if (!pr) {
                return { ok: false, reason: `commit ${commitSha.slice(0, 12)} is not a merged PR into ${branch}` };
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const latestByReviewer = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (!login) continue;
                const previous = latestByReviewer.get(login);
                const currentTime = Date.parse(review.submitted_at || '') || 0;
                const previousTime = Date.parse(previous?.submitted_at || '') || 0;
                if (!previous || currentTime >= previousTime) latestByReviewer.set(login, review);
              }
              const effectiveReviews = [...latestByReviewer.values()];
              const blockingReview = effectiveReviews.find((review) => review.state === 'CHANGES_REQUESTED');
              if (blockingReview) {
                return { ok: false, reason: `PR #${pr.number} still has requested changes` };
              }
              if (effectiveReviews.some((review) => review.state === 'APPROVED')) {
                return { ok: true, pr, evidence: 'approved review' };
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const mergedAt = Date.parse(pr.merged_at);
              const explicitSafeReview = comments.find((comment) =>
                trustedAssociations.has(comment.author_association)
                && safeMarker.test(comment.body || '')
                && (Date.parse(comment.created_at || '') || 0) <= mergedAt
              );
              if (explicitSafeReview) return { ok: true, pr, evidence: 'pre-merge SAFE TO MERGE' };
              if (allowBootstrap && bootstrapUnreviewed.has(commitSha)) {
                return { ok: true, pr, evidence: 'bounded historical bootstrap exception' };
              }
              return { ok: false, reason: `PR #${pr.number} has no approving review or pre-merge SAFE TO MERGE marker` };
            };

            const successfulTestJob = async (commitSha) => {
              const runs = await pushRuns(commitSha);
              const releaseRun = latestRun(runs, releaseWorkflow);
              if (!releaseRun || releaseRun.status !== 'completed') return null;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: releaseRun.id,
                per_page: 100,
              });
              const testJob = jobs
                .filter((job) => job.name === 'test')
                .sort((a, b) => Date.parse(b.completed_at || b.started_at || '') - Date.parse(a.completed_at || a.started_at || ''))[0];
              return testJob?.conclusion === 'success' ? { releaseRun, testJob } : null;
            };

            const successfulSmoke = async (commitSha) => {
              const runs = await pushRuns(commitSha);
              const run = latestRun(runs, smokeWorkflow);
              return run?.status === 'completed' && run?.conclusion === 'success' ? run : null;
            };

            const deploymentProof = async (commitSha) => {
              const runs = await pushRuns(commitSha);
              const releaseRun = latestRun(runs, releaseWorkflow);
              const smokeRun = latestRun(runs, smokeWorkflow);
              if (
                releaseRun?.status !== 'completed' || releaseRun?.conclusion !== 'success'
                || smokeRun?.status !== 'completed' || smokeRun?.conclusion !== 'success'
              ) return null;

              const verifiedAt = Math.max(
                Date.parse(releaseRun.updated_at || releaseRun.created_at || '') || 0,
                Date.parse(smokeRun.updated_at || smokeRun.created_at || '') || 0,
              );
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: commitSha,
              });
              const deployment = (status.statuses || [])
                .filter((row) =>
                  row.context === railwayContext
                  && row.state === 'success'
                  && railwayServicePattern.test(row.target_url || '')
                )
                .sort((a, b) => Date.parse(b.created_at || '') - Date.parse(a.created_at || ''))
                .find((row) => (Date.parse(row.created_at || '') || 0) > verifiedAt);
              return deployment ? { releaseRun, smokeRun, deployment, verifiedAt } : null;
            };

            const currentReview = await reviewedMerge(sha, { retry: true });
            if (!currentReview.ok) {
              core.setFailed(`Production deployment requires reviewed merge evidence: ${currentReview.reason}.`);
              return;
            }

            const currentCommit = await github.rest.repos.getCommit({ owner, repo, ref: sha });
            let cursor = currentCommit.data.parents?.[0]?.sha || null;
            if (!cursor) {
              core.setFailed('Release gate could not identify the first parent commit.');
              return;
            }

            const skipped = [];
            let deployedAnchor = null;
            for (let depth = 0; depth < maxDepth && cursor; depth += 1) {
              const proof = await deploymentProof(cursor);
              if (proof) {
                deployedAnchor = { sha: cursor, ...proof };
                break;
              }
              skipped.push(cursor);
              cursor = await firstParent(cursor);
            }
            if (!deployedAnchor) {
              core.setFailed(`No verified deployed first-parent ancestor found within ${maxDepth} commits.`);
              return;
            }

            for (const commitSha of skipped) {
              const test = await successfulTestJob(commitSha);
              if (!test) {
                core.setFailed(
                  `Skipped ancestor ${commitSha.slice(0, 12)} has no successful release-check test job; it cannot be carried into production.`,
                );
                return;
              }
              const smoke = await successfulSmoke(commitSha);
              if (!smoke) {
                core.setFailed(
                  `Skipped ancestor ${commitSha.slice(0, 12)} has no successful production-smoke run; it cannot be carried into production.`,
                );
                return;
              }
              const review = await reviewedMerge(commitSha, { allowBootstrap: true });
              if (!review.ok) {
                core.setFailed(
                  `Skipped ancestor ${commitSha.slice(0, 12)} lacks review evidence: ${review.reason}.`,
                );
                return;
              }
              core.info(
                `Validated skipped ancestor ${commitSha.slice(0, 12)} via test, smoke, and ${review.evidence} on PR #${review.pr.number}.`,
              );
            }

            core.info(
              `Release gate passed for PR #${currentReview.pr.number}; nearest verified deployed ancestor is ${deployedAnchor.sha.slice(0, 12)} and ${skipped.length} skipped merge(s) were individually validated.`,
            );

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and test suite
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee release-check.log
      - name: Upload failed release-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-log
          path: release-check.log
          if-no-files-found: error
          retention-days: 3
