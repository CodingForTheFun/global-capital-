name: Auto Scout release checks

on:
  pull_request:
    branches:
      - production-stable
  push:
    branches:
      - production-stable
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: read

jobs:
  review-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reviewed merge from last deployed parent
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const branch = 'production-stable';
            const railwayContext = 'AutoProp Scout Pro - autoprop-live';
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const safeMarker = /\bSAFE\s+TO\s+MERGE\b/i;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const incidentDirectLock = '335215c2d3054b636c6937b1ba0d6c48ee363c13';
            const incidentLockParent = '3bf7b261f239f84f3308d5d24608fb49ac3e8f7d';
            const recoveryAncestor = '1e05bd2a8bddad6079f759856cb66acd1a04c8b9';
            const releaseLockPath = '.railway/manual-deploy-lock-4d7a31f6c9b24858a0e6731f42cd95be';

            async function deployed(commitSha) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: commitSha });
              return data.statuses.some(
                (status) => status.context === railwayContext && status.state === 'success',
              );
            }

            async function reviewedProductionMerge(commitSha) {
              const pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: commitSha, per_page: 100 },
              );
              const pr = pulls.find(
                (item) => item.merged_at
                  && item.base?.ref === branch
                  && item.merge_commit_sha === commitSha,
              );
              if (!pr) return false;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const latestByReviewer = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (!login) continue;
                const previous = latestByReviewer.get(login);
                const currentTime = Date.parse(review.submitted_at || '') || 0;
                const previousTime = Date.parse(previous?.submitted_at || '') || 0;
                if (!previous || currentTime >= previousTime) latestByReviewer.set(login, review);
              }
              const effectiveReviews = [...latestByReviewer.values()];
              if (effectiveReviews.some((review) => review.state === 'CHANGES_REQUESTED')) return false;
              if (effectiveReviews.some((review) => review.state === 'APPROVED')) return true;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const mergedAt = Date.parse(pr.merged_at);
              return comments.some((comment) => trustedAssociations.has(comment.author_association)
                && safeMarker.test(comment.body || '')
                && (Date.parse(comment.created_at || '') || 0) <= mergedAt);
            }

            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
            const parentSha = commit.parents?.[0]?.sha;
            if (!parentSha) {
              core.setFailed('Release gate could not identify the first parent commit.');
              return;
            }

            let parentWasDeployed = await deployed(parentSha);
            if (!parentWasDeployed) {
              // One-time recovery for #396. The application fix was merged and
              // checked, but its Railway watched lock was changed in a later
              // direct commit. That direct commit was correctly blocked, leaving
              // a short undeployed chain. Walk at most eight immutable first-
              // parent commits back to the last successful deployment. Every
              // intervening commit must itself be a reviewed production merge,
              // except the exact incident lock commit, which must be lock-only.
              // This keeps concurrent reviewed merges safe while refusing any
              // other direct push. Remove this block after the recovery deploy.
              let cursor = parentSha;
              let sawIncidentLock = false;
              let recoveryValid = false;
              for (let step = 0; step < 8; step += 1) {
                if (cursor === recoveryAncestor) {
                  recoveryValid = sawIncidentLock && await deployed(cursor);
                  break;
                }

                const { data: item } = await github.rest.repos.getCommit({ owner, repo, ref: cursor });
                const firstParent = item.parents?.[0]?.sha;
                if (!firstParent) break;

                if (cursor === incidentDirectLock) {
                  if (firstParent !== incidentLockParent) break;
                  const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${firstParent}...${cursor}`,
                  });
                  const files = comparison.files || [];
                  if (files.length !== 1 || files[0].filename !== releaseLockPath) break;
                  sawIncidentLock = true;
                } else if (!(await reviewedProductionMerge(cursor))) {
                  break;
                }
                cursor = firstParent;
              }

              if (recoveryValid) {
                parentWasDeployed = true;
                core.warning('Using bounded #396 release-chain recovery through reviewed merges and the exact lock-only incident commit. Restore the normal parent-only gate after deployment.');
              }
            }

            if (!parentWasDeployed) {
              core.setFailed(
                `Release parent ${parentSha.slice(0, 12)} has no successful ${railwayContext} status and does not satisfy the bounded #396 recovery chain.`,
              );
              return;
            }

            let pulls = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: sha, per_page: 100 },
              );
              if (pulls.length) break;
              if (attempt < 6) await sleep(5000);
            }

            const pr = pulls.find(
              (item) => item.merged_at
                && item.base?.ref === branch
                && item.merge_commit_sha === sha,
            );
            if (!pr) {
              core.setFailed('Production deployment requires a merged pull request into production-stable; direct pushes are not releasable.');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              const previous = latestByReviewer.get(login);
              const currentTime = Date.parse(review.submitted_at || '') || 0;
              const previousTime = Date.parse(previous?.submitted_at || '') || 0;
              if (!previous || currentTime >= previousTime) latestByReviewer.set(login, review);
            }
            const effectiveReviews = [...latestByReviewer.values()];
            const blockingReview = effectiveReviews.find((review) => review.state === 'CHANGES_REQUESTED');
            if (blockingReview) {
              core.setFailed(`PR #${pr.number} still has requested changes from ${blockingReview.user?.login || 'a reviewer'}.`);
              return;
            }
            const approvedReview = effectiveReviews.find((review) => review.state === 'APPROVED');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const mergedAt = Date.parse(pr.merged_at);
            const explicitSafeReview = comments.find((comment) => trustedAssociations.has(comment.author_association)
              && safeMarker.test(comment.body || '')
              && (Date.parse(comment.created_at || '') || 0) <= mergedAt);

            if (!approvedReview && !explicitSafeReview) {
              core.setFailed(`PR #${pr.number} has no approving review and no pre-merge SAFE TO MERGE marker from a trusted repository member. Review must complete before customer-facing deployment can start.`);
              return;
            }

            core.info(`Release gate passed for PR #${pr.number}; parent chain resolves to a previously deployed release and review evidence is present.`);

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and test suite
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee release-check.log
      - name: Upload failed release-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-log
          path: release-check.log
          if-no-files-found: error
          retention-days: 3
